[project]
name = "futures-signal-bot"
version = "0.1.0"
description = "Telegram-бот торговых сигналов по крипто-фьючерсам (инструмент + честная статистика)"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "ccxt>=4.0",
    "aiogram>=3.0",
    "Flask>=3.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.8"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# встроенные CSS/HTML-строки шаблона карточки — построчный wrap сломал бы читаемость
# и диффабельность против исходного дизайна; длина строк здесь не code smell
"app/delivery/graphics.py" = ["E501"]

[tool.mypy]
# 3.11 = прод (Hetzner /opt/cpython-3.11.15 и маковский .venv); 3.9 был локальным
# системным питоном до венв-эпохи и давно не поддерживается mypy
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
