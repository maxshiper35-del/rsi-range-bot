<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RSI Range — живой терминал</title>
<meta property="og:title" content="RSI Range — живой терминал">
<meta property="og:description" content="Прозрачный трек-рекорд крипто-фьючерс сигналов: эквити в R, winrate, открытые позиции. Каждая сделка — в проверяемом журнале (CSV + SHA-256). Не финансовый совет. 18+">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="description" content="Прозрачный трек-рекорд крипто-фьючерс сигналов RSI Range. Не финансовый совет. 18+">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* v4 «биржевой терминал» (фидбэк владельца 14.08: равнение на Bybit/TradingView).
   Тёмная тема ВСЕГДА — как у бирж; плотные панели, Inter для UI + Plex Mono для цифр.
   Пара роста/падения #1f9e6e/#f6465d валидирована dataviz-валидатором на #14181d
   (deutan 7.1 в полосе 6–8 — легально: везде вторичное кодирование знаками +/−, ▲/▼,
   а серия квадратов кодируется заливкой/контуром, не только цветом). Оранжевый —
   единственный акцент бренда, данные им не красим. */
:root{
  color-scheme:dark;
  --bg:#0b0e11; --panel:#14181d; --panel2:#232a32; --ink:#eaecef; --ink-2:#8a94a1;
  --ink-3:#5c6672; --line:#232a32; --grid:#1e242b; --surface:#14181d;
  --pos:#1f9e6e; --neg:#f6465d; --zero:#3a424c; --acc:#f7a600;
  /* движение: сильный ease-out для откликов, ease-in-out для перемещений, iOS-кривая шторки */
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*{margin:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:13px/1.5 Inter,-apple-system,system-ui,Roboto,sans-serif;background:var(--bg);
     color:var(--ink);padding:0 0 40px;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:0 12px;position:relative}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:12px 2px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wordmark{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;
  font-size:13.5px;letter-spacing:.12em}
.wordmark::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;
  background:var(--acc);border-radius:2px;vertical-align:baseline}
.live{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);
  margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace}
.live i{width:6px;height:6px;border-radius:50%;background:var(--acc);
  animation:pulse 2.2s ease-in-out infinite}
.live{cursor:pointer;-webkit-tap-highlight-color:transparent}
.live.busy i{animation:pulse .5s ease-in-out infinite}
.hrow b.trunc{max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:2px;margin:10px 0 2px}
.tab{padding:4px 12px;border-radius:4px;font-size:12px;color:var(--ink-2);cursor:pointer;
  transition:color .15s ease,background-color .15s ease,transform 160ms var(--ease-out);user-select:none}
.tab.on{background:var(--panel2);color:var(--ink);font-weight:600}

/* сводка: доминирующий итог + колонка метрик — панель терминала */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.hero-main{padding:16px 14px 14px}
.hero-num.up{text-shadow:0 0 30px rgba(31,158,110,.3)}
.hero-num.dn{text-shadow:0 0 30px rgba(246,70,93,.28)}
.hero-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:700;
  font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:-.03em}
.hero-num.up{color:var(--pos)} .hero-num.dn{color:var(--neg)}
.hero-sub{font-size:11px;color:var(--ink-3);margin-top:7px}
.hero-side{border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.mrow{display:flex;justify-content:space-between;align-items:baseline;
  padding:7px 14px;border-top:1px solid var(--grid)}
.mrow:first-child{border-top:none}
.mrow b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13.5px;font-weight:600;
  white-space:nowrap}
.mrow span{font-size:10.5px;color:var(--ink-3)}

.strip{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;margin-top:8px;overflow:hidden}
.cell{flex:1;padding:9px 12px;text-align:left;border-left:1px solid var(--grid)}
.cell:first-child{border-left:none}
.cell b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14.5px;font-weight:600;display:block}
.cell span{font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}

section{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px 9px;margin-top:8px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h h2{font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--ink-2);
  text-transform:uppercase}
.sec-h .note{font-size:10.5px;color:var(--ink-3);margin-left:auto}
.plot{padding:2px 0 0}
svg{display:block;width:100%}

.sq{display:flex;gap:5px;align-items:center;padding:2px 0 4px}
.sq i{width:15px;height:15px;border-radius:3px;transition:transform .15s}
.sq i.w{background:var(--pos)}
.sq i.l{background:transparent;border:2px solid var(--neg)}   /* минус = контур, не только цвет */
.sq .net{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12.5px;color:var(--ink-2)}

.pos-t{width:100%;border-collapse:collapse}
.pos-t td{padding:7px 2px;border-top:1px solid var(--grid);font-size:12.5px;transition:background .15s}
.pos-t tr:first-child td{border-top:none}
.pos-t .sym{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;font-size:12.5px}
.pos-t .dim{text-align:right;color:var(--ink-3);font-size:11px;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.pos-t .st{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  letter-spacing:.03em;color:var(--ink-3);text-align:right;white-space:nowrap}
.pos-t tr.pend .sym,.pos-t tr.pend .side-tag{opacity:.5}
.up{color:var(--pos)} .dn{color:var(--neg)}
.pos-t .lv{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  color:var(--ink-2);white-space:nowrap}
.pos-t .urc{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;white-space:nowrap}
.mystat{font-size:11.5px;color:var(--ink-2);margin:-2px 0 8px}
.mystat b{font-family:"IBM Plex Mono",ui-monospace,monospace}
.pos-t .ck{width:24px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:14px;color:var(--ink-3);user-select:none}
tr[data-sid]{cursor:pointer}
tr[data-sid].busy{opacity:.45;pointer-events:none}
.side-tag{display:inline-block;min-width:13px;text-align:center;margin-right:7px;
  font-family:ui-monospace,monospace;font-weight:700;font-size:11px}
.side-tag.l{color:var(--pos)} .side-tag.s{color:var(--neg)}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
@media (max-width:480px){.two-col{grid-template-columns:1fr;gap:4px}}
.foot{font-size:10.5px;color:var(--ink-3);line-height:1.6;padding:12px 2px 0;margin-top:6px}
.foot a{color:var(--ink-2)}
.tip{position:fixed;pointer-events:none;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;padding:4px 8px;border-radius:5px;opacity:0;transition:opacity .12s;
  z-index:9;white-space:nowrap}
.warn{font-size:11px;color:color-mix(in srgb,var(--acc) 75%,var(--ink-2));margin-top:7px}

.tgl{position:relative;width:36px;height:20px;border-radius:10px;background:var(--panel2);
  cursor:pointer;transition:background .2s;flex:0 0 auto}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:var(--ink-2);transition:transform .2s,background .2s}
.tgl.on{background:var(--pos)}
.tgl.on::after{transform:translateX(16px);background:#fff}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--grid)}
.set-row:first-of-type{border-top:none}
.set-row .lbl{font-size:12.5px;flex:1}
.set-row .key{font-size:10px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--ink);
  font:12.5px "IBM Plex Mono",ui-monospace,monospace;padding:5px 8px;width:110px}
.inp.wide{width:100%}
.inp:focus{outline:none;border-color:var(--acc)}
select.inp{width:auto}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);font-size:12px;font-weight:600;padding:7px 14px;cursor:pointer;
  transition:border-color .15s ease,color .15s ease,transform 160ms var(--ease-out)}
.btn:disabled{opacity:.5;cursor:default}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 0;border-top:1px solid var(--grid);font-size:12.5px}
.hrow:first-of-type{border-top:none}
.hrow b{font-family:"IBM Plex Mono",ui-monospace,monospace}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.dot.ok{background:var(--pos)} .dot.bad{background:var(--neg)} .dot.na{background:var(--zero)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:70;
  transform:translate(-50%,8px);background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font-size:12.5px;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;max-width:92vw;
  box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity 150ms ease,transform 150ms ease}
.toast.show{opacity:1;transform:translate(-50%,0);transition:opacity 200ms ease,transform 220ms var(--ease-out)}
.fx{opacity:0;transform:translateY(8px);animation:in 320ms var(--ease-out) forwards}
@keyframes in{to{opacity:1;transform:none}}
/* скелетоны («синабоны», фидбэк 31.08): призрак реального лейаута с шиммером,
   а не безликие полоски — юзер сразу видит, ЧТО грузится */
.skel{position:relative;overflow:hidden;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;margin-top:8px;padding:14px}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 35%,
    color-mix(in srgb,var(--panel2) 55%,transparent) 50%,transparent 65%);
  background-size:220% 100%;animation:sh 1.4s linear infinite}
.sk{background:var(--panel2);border-radius:4px;height:12px}
.sk.big{height:38px;width:45%;border-radius:6px}
.sk.t{width:30%;height:9px;margin-bottom:10px}
.sk.w25{width:25%} .sk.w40{width:40%} .sk.w60{width:60%} .sk.w85{width:85%}
.sk + .sk{margin-top:9px}
.skel .sk-chart{height:150px;border-radius:6px;background:
  repeating-linear-gradient(90deg,var(--panel2) 0 2px,transparent 2px 46px),
  linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--panel2) 55%,transparent));
  border-bottom:1px solid var(--grid)}
.skel-grid{display:flex;gap:8px;margin-top:8px}
.skel-grid .skel{flex:1;margin-top:0;height:58px}
@keyframes sh{to{background-position:-220% 0}}
@media (prefers-reduced-motion: reduce){
  .fx,.live i,.skel::after,#app.swap{animation:none;opacity:1;transform:none}
  .sheet-box,.sheet.show .sheet-box,#chartModal .cm-box,.toast,.toast.show,.tb-ind{transition:opacity .15s ease;transform:none}
  .toast{transform:translate(-50%,0)}
  .btn:active,.chip:active,.pill:active,.tab:active,.tb:active,.tgl:active{transform:none}
}

/* --- бэктест по месяцам (тепловая сетка) --- */
.bt-wrap{overflow-x:auto;scrollbar-width:none}
.bt-wrap::-webkit-scrollbar{display:none}
.bt{display:grid;grid-template-columns:38px repeat(12,minmax(24px,1fr)) 46px;gap:2px;
  min-width:420px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px}
.bt .h{color:var(--ink-3);text-align:center;padding:2px 0 3px;font-size:9px}
.bt .y{color:var(--ink-2);display:flex;align-items:center;font-size:10px}
.bt .c{height:24px;display:flex;align-items:center;justify-content:center;border-radius:4px;
  color:var(--ink);background:rgba(139,147,167,.07)}
.bt .c.e{background:transparent;color:var(--ink-3)}
.bt .t{height:24px;display:flex;align-items:center;justify-content:flex-end;font-weight:700;
  padding-right:2px}
.bt .c.f{box-shadow:inset 0 0 0 1.5px var(--acc)}
.bt .c.p{opacity:.55}
.bt-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 0;font-size:10.5px;color:var(--ink-3)}
.bt-legend .lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;
  vertical-align:-1px;background:rgba(31,158,110,.45)}
.bt-legend .lg.f{box-shadow:inset 0 0 0 1.5px var(--acc)}
.bt-legend .lg.p{opacity:.55}
.bt-stats{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 4px;font-size:11px;
  color:var(--ink-2)}
.bt-stats b{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink)}
@media (max-width:480px){
  /* телефон: вся сетка год×месяц целиком, без горизонтального скролла */
  .bt{grid-template-columns:28px repeat(12,minmax(18px,1fr)) 36px;gap:1.5px;min-width:0;
    font-size:8.5px}
  .bt .h{font-size:8px;padding:1px 0 2px}
  .bt .y{font-size:9px}
  .bt .c,.bt .t{height:21px;border-radius:3px}
  .bt .t{font-size:8.5px}
}
/* --- симулятор депозита --- */
.chip{display:inline-block;padding:2px 10px;margin-left:5px;border:1px solid rgba(139,147,167,.25);
  border-radius:20px;cursor:pointer;font-size:10.5px;color:var(--ink-2);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform 160ms var(--ease-out)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0b0e14;font-weight:700}
.sim-hero{display:flex;align-items:baseline;gap:10px;margin:2px 0 4px;flex-wrap:wrap}
.sim-start{font-size:15px;color:var(--ink-2);font-family:"IBM Plex Mono",ui-monospace,monospace}
.sim-bal{font-size:34px;font-weight:800;font-family:"IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:-.5px}
.sim-bal.up{text-shadow:0 0 26px rgba(31,158,110,.35)}
.sim-bal.dn{text-shadow:0 0 26px rgba(246,70,93,.3)}
.sim-pct{font-size:14px;font-family:"IBM Plex Mono",ui-monospace,monospace}
/* --- монеты (вотчлист с ценой и суточным ходом) --- */
.coins{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.coins::-webkit-scrollbar{display:none}
.coin{display:flex;align-items:center;gap:7px;padding:6px 10px;flex:0 0 auto;
  border:1px solid rgba(139,147,167,.14);border-radius:8px;font-size:11.5px}
.coin b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600}
.cbadge{display:inline-block;padding:2px 6px;border-radius:6px;font-weight:700;
  font-size:9.5px;color:#fff;letter-spacing:.4px;font-family:ui-monospace,monospace}
/* --- сделка на графике --- */
tr[data-chart]{cursor:pointer}
tr[data-chart]:active{background:rgba(139,147,167,.08)}
.pos-t .chb{width:26px;text-align:right;cursor:pointer;font-size:12px;opacity:.75}
#chartModal{display:flex;position:fixed;inset:0;background:rgba(5,7,12,.88);z-index:100;
  align-items:center;justify-content:center;opacity:0;visibility:hidden;
  transition:opacity 160ms ease,visibility 0s linear 180ms}
#chartModal.show{opacity:1;visibility:visible;transition:opacity 220ms ease}
#chartModal .cm-box{transform:scale(.96);transition:transform 160ms ease}
#chartModal.show .cm-box{transform:none;transition:transform 240ms var(--ease-out)}
.cm-box{position:relative;width:min(96vw,860px);height:min(74vh,560px);
  background:var(--bg,#0b0e14);border:1px solid rgba(139,147,167,.2);border-radius:10px;
  display:flex;flex-direction:column;overflow:hidden}
.cm-head{display:flex;align-items:center;gap:8px;padding:10px 40px 10px 12px;
  border-bottom:1px solid rgba(139,147,167,.12);font-size:13px}
.cm-head .res{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace}
.cm-body{flex:1;min-height:0;position:relative}
.cm-x{position:absolute;top:5px;right:8px;background:none;border:0;color:var(--ink-2);
  font-size:22px;cursor:pointer;line-height:1;padding:4px}

/* ---- v6: нижняя панель вкладок (Mini App), подвкладки админки, новые блоки ---- */
/* нажатие: мгновенный отклик (scale 0.97) — интерфейс «слышит» палец */
.btn:active,.chip:active,.pill:active,.tab:active,.tb:active,.tgl:active,.lnk:active{transform:scale(.97)}
tr[data-chart],tr[data-user],.pc{transition:background-color .15s ease}
tr[data-chart]:active td,tr[data-user]:active td,.pc:active{background:color-mix(in srgb,var(--panel2) 55%,transparent)}
@media (hover:hover) and (pointer:fine){
  .tab:hover,.tb:hover,.pill:hover{color:var(--ink)}
  .btn:hover{border-color:var(--acc)}
  .btn.danger:hover{border-color:var(--neg);color:var(--neg)}
  .pos-t tr:hover td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  .pc:hover{background:color-mix(in srgb,var(--panel2) 30%,transparent)}
  .chip:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
}
/* смена вкладки — короткая подача содержимого, а не каскад секций */
#app.swap{animation:swap 200ms var(--ease-out)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{display:flex;width:100%;max-width:680px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;
  background:none;border:0;color:var(--ink-3);font:500 10.5px Inter,system-ui,sans-serif;
  cursor:pointer;border-radius:8px;transition:color .15s,background .15s}
.tb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round}
.tb{position:relative;z-index:1;transition:color .2s ease,transform 160ms var(--ease-out)}
.tb svg{transition:stroke .2s ease}
.tb.on{color:var(--ink)}
.tb.on svg{stroke:var(--acc)}
.tabbar-in{position:relative}
.tb-ind{position:absolute;top:2px;bottom:2px;left:0;border-radius:12px;background:var(--panel2);
  transition:transform 260ms var(--ease-io),opacity .2s ease;pointer-events:none}
.tb:focus-visible,.btn:focus-visible,.chip:focus-visible,.pill:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.subnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0 2px;padding-bottom:2px}
.subnav::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink-2);font:500 12px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap;

<body>
<div class="wrap">
<header>
  <div class="wordmark">RSI&thinsp;RANGE</div>
  <div class="live"><i></i><span id="upd">подключение…</span></div>
</header>
<div class="subnav" id="subnav" style="display:none"></div>
<div class="tabs" id="scope">
  <div class="tab on" data-s="epoch">текущая стратегия</div>
  <div class="tab" data-s="all">вся история</div>
</div>
<div id="app">
  <div class="skel"><div class="sk t"></div><div class="sk big"></div><div class="sk w40"></div></div>
  <div class="skel-grid"><div class="skel"><div class="sk w60"></div><div class="sk w25"></div></div>
    <div class="skel"><div class="sk w60"></div><div class="sk w25"></div></div>
    <div class="skel"><div class="sk w60"></div><div class="sk w25"></div></div></div>
  <div class="skel"><div class="sk t"></div><div class="sk-chart"></div></div>
  <div class="skel"><div class="sk t"></div><div class="sk w85"></div><div class="sk w60"></div>
    <div class="sk w85"></div><div class="sk w40"></div></div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
</div>
<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.platform && tg.platform !== "unknown");
// v4: тема всегда тёмная (биржевой терминал), от темы Telegram не зависит
if (inTg) { tg.ready(); tg.expand();
  if (tg.setHeaderColor) try { tg.setHeaderColor("#0b0e11"); } catch (e) {}
  if (tg.setBackgroundColor) try { tg.setBackgroundColor("#0b0e11"); } catch (e) {} }

let DATA = null, ME = null, ADM = null, SCOPE = "epoch", NAV = "over", BT = null;
// виброотклик Telegram: выбор (вкладки, чипы), касание (действия), итог (успех/ошибка)
const hap = t => { try { const h = tg && tg.HapticFeedback; if (!h) return;
  if (t === "sel") h.selectionChanged(); else if (t === "ok") h.notificationOccurred("success");
  else if (t === "err") h.notificationOccurred("error"); else h.impactOccurred(t || "light"); } catch (e) {} };
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
let SWAP = false;
// localStorage — только удобства зрителя (вкладка, период, калькулятор); недоступен — дефолты
const store = {
  get(k, d) { try { const v = localStorage.getItem("rsi." + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("rsi." + k, v); } catch (e) {} },
};
let CLOSED_FILTER = "all";
let toastT = 0;
function toast(t) {
  const el = $("#toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800);
}
let takeGen = 0;                       // поколение POST /api/take: применяем только последний ответ
const PENDING = new Set();             // sid с запросом в полёте — busy переживает ре-рендер
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtR = (v, d) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(+v).toFixed(d ?? (Math.abs(v) >= 100 ? 0 : 1)) + "R";

function derive(eq) {
  const tr = []; let prev = 0;
  for (const p of eq) { tr.push({ t: p.t, r: +(p.r - prev).toFixed(2) }); prev = p.r; }
  const wins = tr.filter(x => x.r > 0), losses = tr.filter(x => x.r <= 0);
  const wSum = wins.reduce((s, x) => s + x.r, 0), lSum = losses.reduce((s, x) => s + x.r, 0);
  let peak = 0, dd = 0, cum = 0;
  for (const x of tr) { cum += x.r; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); }
  const weeks = new Map();
  for (const x of tr) {
    const d = new Date(x.t + "T00:00Z"), y = new Date(d);
    y.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    const k = y.toISOString().slice(5, 10);
    weeks.set(k, +(((weeks.get(k) || 0) + x.r)).toFixed(2));
  }
  const months = new Map();
  for (const x of tr) {
    const k = x.t.slice(0, 7);
    const m = months.get(k) || { n: 0, w: 0, r: 0 };
    m.n++; if (x.r > 0) m.w++; m.r = +(m.r + x.r).toFixed(2);
    months.set(k, m);
  }
  let ws = 0, ls = 0, maxWs = 0, maxLs = 0;
  for (const x of tr) {
    if (x.r > 0) { ws++; ls = 0; } else { ls++; ws = 0; }
    maxWs = Math.max(maxWs, ws); maxLs = Math.max(maxLs, ls);
  }
  return { tr, pf: lSum ? Math.abs(wSum / lSum) : (wSum ? 99 : 0), maxDD: dd,
           weeks: [...weeks.entries()].slice(-8), last: tr.slice(-10),
           months: [...months.entries()].slice(-6),
           avgWin: wins.length ? wSum / wins.length : 0,
           avgLoss: losses.length ? lSum / losses.length : 0, maxWs, maxLs };
}

function pick() {
  const useEpoch = SCOPE === "epoch" && DATA.epoch;
  return { st: useEpoch ? DATA.epoch : DATA.all,
           eq: useEpoch ? DATA.equity_epoch : DATA.equity_all,
           hold: useEpoch ? DATA.hold_epoch : DATA.hold_all,
           rs: useEpoch ? (DATA.r_epoch || []) : (DATA.r_all || []),
           sp: useEpoch ? (DATA.sp_epoch || []) : (DATA.sp_all || []),
           hh: useEpoch ? (DATA.h_epoch || []) : (DATA.h_all || []),
           daily: useEpoch ? (DATA.daily_epoch || []) : (DATA.daily_all || []),
           split: useEpoch ? DATA.split_epoch : DATA.split_all };
}

// период эквити: точки с даты отсечки, кривая пересчитана от нуля на её начале
let EQP = store.get("eqp", "all"), EQ_SHOWN = [];
function eqSlice(eq, p) {
  if (p === "all" || !eq.length) return eq;
  const cut = new Date(Date.now() - (+p) * 864e5).toISOString().slice(0, 10);
  let base = 0;
  const out = [];
  for (const x of eq) { if (x.t < cut) base = x.r; else out.push({t: x.t, r: +(x.r - base).toFixed(2)}); }
  return out.length >= 2 ? [{t: cut, r: 0}, ...out] : eq;
}

// календарь: 26 недель × 7 дней, итог дня в R (как contribution-график)
function calSVG(daily) {
  const map = new Map(daily.map(x => [x.d, x]));
  const C = 11, G = 2, L = 18, T = 14, WEEKS = 26;
  const now = new Date(), end = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  const start = new Date(end); start.setUTCDate(end.getUTCDate() - ((end.getUTCDay() + 6) % 7) - (WEEKS - 1) * 7);
  const vmax = Math.max(1, ...daily.map(x => Math.abs(x.r)));
  const MN = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  let g = "", lastM = -1;
  ["пн", "", "ср", "", "пт", "", ""].forEach((t, i) => {
    if (t) g += `<text x="0" y="${T + i * (C + G) + 9}" font-size="8" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${t}</text>`;
  });
  for (let w = 0; w < WEEKS; w++) {
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setUTCDate(start.getUTCDate() + w * 7 + d);
      if (day > end) continue;
      const k = day.toISOString().slice(0, 10), v = map.get(k);
      if (d === 0 && day.getUTCMonth() !== lastM) {
        lastM = day.getUTCMonth();
        g += `<text x="${L + w * (C + G)}" y="9" font-size="8" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">${MN[lastM]}</text>`;
      }
      let fill = "var(--panel2)", op = .45;
      if (v) {
        op = .3 + .7 * Math.min(1, Math.abs(v.r) / vmax);
        fill = v.r > 0 ? "var(--pos)" : v.r < 0 ? "var(--neg)" : "var(--zero)";
        if (!v.r) op = 1;
      }
      const tt = `${k.slice(8, 10)}.${k.slice(5, 7)} · ${v ? fmtR(v.r, 2) + " · " + v.n + " сд." : "сделок нет"}`;
      g += `<rect x="${L + w * (C + G)}" y="${T + d * (C + G)}" width="${C}" height="${C}" rx="2" fill="${fill}" opacity="${op}" data-tt="${tt}"/>`;
    }
  }
  return `<svg class="cal" viewBox="0 0 ${L + WEEKS * (C + G)} ${T + 7 * (C + G)}">${g}</svg>`;
}

function splitTable(obj, order, label) {
  const keys = order.filter(k => obj && obj[k]).concat(Object.keys(obj || {}).filter(k => !order.includes(k)));
  if (!keys.length) return "";
  return `<table class="pos-t">${keys.map(k => {
    const v = obj[k];
    return `<tr><td>${label(k)}</td><td class="dim">${v.n} сд.</td>
      <td class="dim">WR ${v.n ? Math.round(v.w / v.n * 100) : 0}%</td>
      <td class="urc"><b class="${v.r >= 0 ? "up" : "dn"}">${fmtR(v.r)}</b></td></tr>`;
  }).join("")}</table>`;
}

const ICONS = {
  over: '<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
  trades: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  mine: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  admin: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
};
const ADMIN_TABS = [["users", "Юзеры"], ["money", "Деньги"], ["signals", "Сигналы"],
                    ["exec", "Executor"], ["settings", "Настройки"], ["system", "Система"]];
let ANAV = "users";
NAV = store.get("nav", "over"); ANAV = store.get("anav", "users");
{ const sp = inTg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;   // t.me/bot/app?startapp=trades
  if (["over", "trades", "mine", "admin"].includes(sp)) NAV = sp; }

function navItems() {
  const out = [["over", "Обзор"], ["trades", "Сделки"]];
  if (ME && ME.private) out.push(["mine", "Моё"]);
  if (ME && ME.admin) out.push(["admin", "Админ"]);
  return out;
}

// сохранённая вкладка («Админ») ждёт прихода прав, а не сбрасывается навсегда
const curNav = () => navItems().some(([k]) => k === NAV) ? NAV : "over";

let NAV_KEYS = "";
function renderNav() {
  const items = navItems(), cur = curNav(), keys = items.map(x => x[0]).join(",");
  const box = $("#tabbarIn");
  if (keys !== NAV_KEYS) {                  // состав вкладок сменился (пришли права) — пересобрать
    NAV_KEYS = keys;
    box.innerHTML = `<i class="tb-ind" style="opacity:0"></i>` + items.map(([k, t]) =>
      `<button class="tb" data-nav="${k}" aria-label="${t}">${ICONS[k]}<span>${t}</span></button>`).join("");
  }
  box.querySelectorAll(".tb").forEach(b => {
    const on = b.dataset.nav === cur;
    b.classList.toggle("on", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  const act = box.querySelector(`.tb[data-nav="${cur}"]`), ind = box.querySelector(".tb-ind");
  if (act && ind) {
    const first = ind.style.opacity === "0";
    if (first) ind.style.transition = "none";
    ind.style.width = (act.offsetWidth - 10) + "px";
    ind.style.transform = `translateX(${act.offsetLeft + 5}px)`;
    if (first) { void ind.offsetWidth; ind.style.transition = ""; ind.style.opacity = "1"; }
  }
  const sn = $("#subnav");
  if (cur === "admin") {
    sn.style.display = "";
    const cnt = {signals: ADM && ADM.open_signals ? ADM.open_signals.length : null,
                 exec: null};
    sn.innerHTML = ADMIN_TABS.map(([k, t]) =>
      `<button class="pill ${k === ANAV ? "on" : ""}" data-anav="${k}">${t}${cnt[k] != null ? `<span class="cnt">${cnt[k]}</span>` : ""}</button>`).join("");
  } else sn.style.display = "none";
}

function render(noAnim) {
  const ae = document.activeElement;
  const fid = ae && ae.id && ae.closest && ae.closest("#app") ? ae.id : null;
  let caret = null;
  try { caret = fid ? ae.selectionStart : null; } catch (e) {}
  renderTab(noAnim);
  if (SWAP) {
    SWAP = false;
    const a = $("#app"); a.classList.remove("swap"); void a.offsetWidth; a.classList.add("swap");
  }
  if (fid) {
    const el = document.getElementById(fid);
    if (el) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

function renderTab(noAnim) {
  $("#tip").style.opacity = 0;
  renderNav();
  const nav = curNav();
  $("#scope").style.display = (nav === "over" && DATA && DATA.epoch) ? "" : "none";
  if (nav === "trades") return renderTrades();
  if (nav === "mine") return renderMine(noAnim);
  if (nav === "admin") {
    if (ANAV === "money") return renderMoney();
    if (ANAV === "signals") return renderSignals();
    if (ANAV === "exec") return renderExec();
    if (ANAV === "settings") return renderSettings();
    if (ANAV === "system") return renderSystem();
    return renderUsers();
  }
  return renderOverview(noAnim);
}

// ---- вкладка «Сделки»: публичная история закрытых с фильтрами и подгрузкой ----
const TR = {side: "", res: "", tf: "", q: "", items: [], total: null, sum: 0, wins: 0,
            loading: false, seq: 0};
function trQuery(offset) {
  const p = new URLSearchParams({offset, limit: 40});
  for (const k of ["side", "res", "tf", "q"]) if (TR[k]) p.set(k, TR[k]);
  return "api/trades?" + p.toString();
}
function trLoad(reset) {
  const seq = ++TR.seq;
  if (reset) { TR.items = []; TR.total = null; }
  TR.loading = true;
  if (curNav() === "trades") render(true);
  fetch(trQuery(reset ? 0 : TR.items.length)).then(r => r.ok ? r.json() : null).then(d => {
    if (seq !== TR.seq) return;                       // ответ на устаревший фильтр
    TR.loading = false;
    if (d && d.ok) {
      TR.items = reset ? d.items : TR.items.concat(d.items);
      TR.total = d.total; TR.sum = d.sum_r; TR.wins = d.wins;
    } else if (reset) TR.total = 0;
    if (curNav() === "trades") render(true);
  }).catch(() => { if (seq === TR.seq) { TR.loading = false; if (curNav() === "trades") render(true); } });
}
function renderTrades() {
  if (TR.total === null && !TR.loading) { trLoad(true); return; }   // trLoad сам перерисует
  const chips = (key, defs) => defs.map(([v, t]) =>
    `<b class="chip${TR[key] === v ? " on" : ""}" data-trf="${key}" data-v="${v}">${t}</b>`).join("");
  const tfs = DATA && DATA.split_all ? Object.keys(DATA.split_all.tf || {}).sort() : ["1h", "4h"];
  let h = `<section><div class="sec-h"><h2>ИСТОРИЯ СДЕЛОК</h2>

// калькулятор объёма: депозит и риск — из /depo бота (сервер), иначе локальные дефолты
let CALC = null;
function calcState() {
  if (!CALC) {
    const d = ME && ME.depo;
    CALC = {usd: d ? d.usd : +store.get("calc.usd", 1000), risk: d ? d.risk : +store.get("calc.risk", 1)};
  }
  return CALC;
}
const fmtQty = q => q >= 1000 ? Math.round(q).toLocaleString("en-US") : q >= 100 ? q.toFixed(0)
  : q >= 1 ? q.toFixed(2) : q.toPrecision(3);
function sizing(o) {
  const c = calcState(), per = Math.abs(o.entry - o.stop);
  if (!per || !(c.usd > 0) || !(c.risk > 0)) return "";
  const riskUsd = c.usd * c.risk / 100, qty = riskUsd / per, notional = qty * o.entry;
  const lev = notional / c.usd;
  return `<div class="sz">объём <b>${fmtQty(qty)}</b> · номинал <b>$${Math.round(notional).toLocaleString("en-US")}</b> · плечо <b class="${lev > 20 ? "warnx" : ""}">×${lev.toFixed(1)}</b> · риск <b>$${riskUsd.toFixed(riskUsd >= 100 ? 0 : 2)}</b>${lev > 20 ? ' <span class="warnx">— выше ×20, уменьши риск</span>' : ""}</div>`;
}

        k => `<span class="side-tag ${k === "LONG" ? "l" : "s"}">${k === "LONG" ? "▲" : "▼"}</span><span class="sym">${k === "LONG" ? "лонг" : "шорт"}</span>`)}

  }
  h += sec(`<section><div class="sec-h"><h2>R ПО НЕДЕЛЯМ</h2>

    <div class="plot">${weeksSVG(d.weeks)}</div></section>`);
  h += sec(`<section><div class="sec-h"><h2>ПОСЛЕДНИЕ ${d.last.length}</h2>
    <span class="note">■ плюс · □ минус</span></div>
    <div class="sq">${d.last.map(x =>
      `<i class="${x.r > 0 ? "w" : "l"}" title="${x.t} ${fmtR(x.r)}"></i>`).join("")}
      <span class="net">${fmtR(d.last.reduce((s, x) => s + x.r, 0))}</span></div></section>`);
  h += sec(`<section><div class="sec-h"><h2>РАСПРЕДЕЛЕНИЕ</h2>
    <span class="note">сделок в диапазоне R</span></div>
    <div class="plot">${histSVG(d.tr)}</div></section>`);
  if ((d.months || []).length > 1) {
    h += sec(`<section><div class="sec-h"><h2>ПО МЕСЯЦАМ</h2>
      <span class="note">закрытые сделки</span></div>
      <table class="pos-t">${d.months.map(([m, v]) =>
        `<tr><td><span class="sym">${m}</span></td><td class="dim">${v.n} сд.</td>
         <td class="dim">WR ${v.n ? Math.round(v.w / v.n * 100) : 0}%</td>
         <td class="urc"><b class="${v.r >= 0 ? "up" : "dn"}">${fmtR(v.r)}</b></td></tr>`).join("")}
      </table></section>`);
  }
  if (BT && BT.months) {
    const MN = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
    const M = BT.months;
    // ФАКТ: живой журнал текущей стратегии (эквити эпохи) — месяцы ПОСЛЕ последнего
    // месяца модели дорисовываются автоматически, помечены отдельно. Модель и факт
    // никогда не смешиваются в одной ячейке: граница — последний месяц бэктеста
    const lastModel = Object.keys(M).sort().pop();
    const F = {};
    (DATA.equity_epoch || []).forEach((p, i, arr) => {
      const k = (p.t || "").slice(0, 7);
      if (!k || k <= lastModel) return;
      const r = p.r - (i ? arr[i - 1].r : 0);
      const f = F[k] || (F[k] = {n: 0, w: 0, r: 0});
      f.n++; f.w += r > 0 ? 1 : 0; f.r += r;
    });
    const nowKey = new Date().toISOString().slice(0, 7);
    const years = [...new Set([...Object.keys(M), ...Object.keys(F)].map(k => k.slice(0, 4)))].sort();
    const vals = Object.values(M).map(v => v.r);
    const vmax = Math.max(1, ...vals.map(Math.abs), ...Object.values(F).map(v => Math.abs(v.r)));
    const cell = (r, fact, partial) => {
      const a = Math.min(1, Math.abs(r) / vmax) * 0.55 + 0.12;
      const bg = r >= 0 ? `rgba(31,158,110,${a})` : `rgba(246,70,93,${a})`;
      const ttl = `${fmtR(r)}${fact ? " · факт (живой журнал)" : " · модель"}${partial ? " · месяц не закончен" : ""}`;
      return `<div class="c${fact ? " f" : ""}${partial ? " p" : ""}" style="background:${bg}" title="${ttl}">${r > 0 ? "+" : ""}${Math.round(r)}</div>`;
    };
    let g = `<div class="h"></div>${MN.map(m => `<div class="h">${m}</div>`).join("")}<div class="h">год</div>`;
    for (const y of years) {
      let tot = 0;
      g += `<div class="y">${y}</div>`;
      for (let m = 1; m <= 12; m++) {
        const k = `${y}-${String(m).padStart(2, "0")}`;
        if (M[k]) { tot += M[k].r; g += cell(M[k].r, false, false); }
        else if (F[k]) { tot += F[k].r; g += cell(F[k].r, true, k === nowKey); }
        else g += `<div class="c e">·</div>`;
      }
      g += `<div class="t ${tot >= 0 ? "up" : "dn"}">${fmtR(tot, 0)}</div>`;
    }
    const fk = Object.keys(F).sort();
    const fSum = fk.reduce((a, k) => a + F[k].r, 0), fPos = fk.filter(k => F[k].r > 0).length;
    const factLine = fk.length
      ? `<div class="mystat" style="margin-top:6px">факт с ${fk[0]}: <b>${fk.length}</b> мес. · <b class="${fSum >= 0 ? "up" : "dn"}">${fmtR(fSum)}</b> · плюсовых <b>${fPos}/${fk.length}</b> — по живому журналу, обновляется само</div>`
      : "";
    const pos = vals.filter(v => v > 0).length, n = vals.length;
    const sorted = [...vals].sort((a, b) => a - b);
    let run = 0, worstRun = 0;
    for (const k of Object.keys(M).sort()) { run = M[k].r <= 0 ? run + 1 : 0; worstRun = Math.max(worstRun, run); }
    const T = BT.totals || {};
    h += sec(`<section><div class="sec-h"><h2>БЭКТЕСТ 5 ЛЕТ · ПО МЕСЯЦАМ</h2>
      <span class="note">модель, не живой журнал</span></div>
      <div class="bt-wrap"><div class="bt">${g}</div></div>
      <div class="bt-legend"><span><i class="lg m"></i>модель (бэктест до ${lastModel})</span><span><i class="lg f"></i>факт (живой журнал)</span><span><i class="lg p"></i>текущий месяц</span></div>
      ${factLine}
      <div class="bt-stats">
        <span>плюсовых месяцев <b>${pos}/${n}</b> (${Math.round(pos / n * 100)}%)</span>
        <span>медиана <b>${fmtR(sorted[Math.floor(n / 2)])}</b></span>
        <span>худший <b class="dn">${fmtR(sorted[0])}</b></span>
        <span>убыточных подряд <b>≤${worstRun}</b></span>
        <span>сделок <b>${T.trades || "—"}</b></span>
        <span>на сделку <b>${T.expectancy_r != null ? fmtR(T.expectancy_r, 2) : "—"}</b></span>
        <span>просадка <b class="dn">−${T.max_dd_r != null ? T.max_dd_r.toFixed(0) : "—"}R</b>${(() => {
          const w = BT.max_dd_window; if (!w) return "";
          const f = s => s ? s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4) : "?";
          return ` <span class="dim">(${f(w.peak)} → ${f(w.trough)}, ${w.days} дн., по сделкам — глубже месячных итогов)</span>`;
        })()}</span>
      </div>
      <div class="mystat" style="margin:6px 0 0;color:var(--ink-3)">Текущая конфигурация стратегии на 5-летней истории ${(BT.symbols || []).length} эталонных монет (${(BT.period || []).join(" → ")}), 1h+4h, тейкерские издержки и фандинг учтены. Прошлое ≠ будущее: выборка монет выбрана из выживших, реальная ликвидность и слип на тонких альтах не смоделированы.</div>
      </section>`);
  }
  const sy = DATA.symbols;
  if (sy && (sy.best || []).length) {
    const syRow = o => `<tr><td><span class="sym">${esc(o.s)}</span></td><td class="dim">${o.n} сд.</td>
      <td class="urc"><b class="${o.r >= 0 ? "up" : "dn"}">${fmtR(o.r)}</b></td></tr>`;
    h += sec(`<section><div class="sec-h"><h2>ИНСТРУМЕНТЫ</h2>
      <span class="note">лучшие и худшие · вся история</span></div>
      <div class="two-col"><table class="pos-t">${sy.best.map(syRow).join("")}</table>
      <table class="pos-t">${(sy.worst || []).map(syRow).join("")}</table></div></section>`);
  }
  if (DATA.open_signals.length && !(ME && ME.private)) {   // подписчику хватает «МОИХ ПОЗИЦИЙ»
    h += sec(`<section><div class="sec-h"><h2>ОТКРЫТЫ СЕЙЧАС</h2>
      <span class="note">уровни — по подписке</span></div><table class="pos-t">${
      DATA.open_signals.map(o =>
        `<tr${o.in_pos === false ? ` class="pend"` : ""}><td><span class="side-tag ${o.side === "LONG" ? "l" : "s"}">${o.side === "LONG" ? "▲" : "▼"}</span><span class="sym">${esc(o.symbol)}</span></td>
         <td class="dim">${esc(o.tf)}</td><td class="st">${o.in_pos == null ? "" : o.in_pos ? "в позиции" : "ждёт входа"}</td>
         <td class="dim">${o.age_h != null ? Math.round(o.age_h) + "ч" : ""}</td></tr>`).join("")
      }</table></section>`);
  }
  if ((DATA.last_closed || []).length) {
    const cfDefs = [["all", "все"], ["long", "▲"], ["short", "▼"], ["win", "+"], ["loss", "−"]];
    const cfFn = {all: () => true, long: o => o.side === "LONG", short: o => o.side !== "LONG",
                  win: o => (o.r || 0) > 0, loss: o => (o.r || 0) <= 0};
    const rowsCf = DATA.last_closed.filter(cfFn[CLOSED_FILTER] || cfFn.all);
    const netCf = rowsCf.reduce((a, o) => a + (o.r || 0), 0);
    h += sec(`<section><div class="sec-h"><h2>ЗАКРЫТЫЕ</h2>
      <span class="note">${cfDefs.map(([k, lbl]) =>
        `<b class="chip${CLOSED_FILTER === k ? " on" : ""}" data-cf="${k}">${lbl}</b>`).join("")}</span></div>
      ${rowsCf.length ? `<div class="mystat">${rowsCf.length} сд. · итог <b class="${netCf >= 0 ? "up" : "dn"}">${fmtR(netCf)}</b> · тап — сделка на графике</div>
      <table class="pos-t">${rowsCf.map(o =>
        `<tr data-chart="${o.id}"><td><span class="side-tag ${o.side === "LONG" ? "l" : "s"}">${o.side === "LONG" ? "▲" : "▼"}</span><span class="sym">${esc(o.s)}</span></td>
         <td class="dim">${esc(o.tf)}</td><td class="dim">${esc(o.d)}</td>
         <td class="urc"><b class="${(o.r || 0) >= 0 ? "up" : "dn"}">${fmtR(o.r || 0)}</b></td>
         <td class="chb">📈</td></tr>`).join("")}</table>`
      : `<div class="warn" style="padding:8px 0">по фильтру пусто</div>`}</section>`);
  }
  h += sec(`<div class="foot">Каждая сделка — в проверяемом журнале: /trackrecord у
    @rsirange_bot (CSV + SHA-256, историю нельзя переписать задним числом).
    Минусовые периоды не скрываются.<br>⚠ Не финансовый совет. Прошлые результаты
    не определяют будущие. 18+</div>`);
  $("#app").innerHTML = h;
  wireTip();
  if (!noAnim && !REDUCED && !INTRO_DONE) { INTRO_DONE = true; intro(tot); }
}

// первый показ (редкое событие — можно дать «вкусность»): итог досчитывается, кривая рисуется
let INTRO_DONE = false;
function intro(total) {
  const el = $("#heroNum"), t0 = performance.now(), dur = 750;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    if (el && el.isConnected) el.textContent = p < 1 ? fmtR(total * e) : fmtR(total);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  const line = $("#eq .eqline");
  if (line && line.getTotalLength && line.animate) {
    const L = line.getTotalLength();
    line.animate([{strokeDasharray: `${L}`, strokeDashoffset: L}, {strokeDasharray: `${L}`, strokeDashoffset: 0}],
                 {duration: 1000, easing: "cubic-bezier(.23,1,.32,1)", delay: 150});
  }
}

// свайп вниз по шапке шторки: порог 90px ИЛИ быстрый флик (скорость > 0.5 px/мс)
(() => {
  let y0 = 0, t0 = 0, dy = 0, drag = false;
  const box = () => $(".sheet-box");
  document.addEventListener("pointerdown", e => {
    if (!e.target.closest(".sheet-h,.grab") || e.target.closest("button")) return;
    drag = true; y0 = e.clientY; t0 = performance.now(); dy = 0;
    box().classList.add("drag");
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  });
  document.addEventListener("pointermove", e => {
    if (!drag) return;
    const raw = e.clientY - y0;
    dy = raw >= 0 ? raw : raw * 0.2;                  // вверх — с трением, не в стену
    box().style.transform = `translateY(${dy}px)`;
  });
  const end = () => {
    if (!drag) return;
    drag = false;

// ---- админ: деньги ----
let MCUR = "XTR";
function revenueSVG(daily, cur) {
  const days = 90, now = Date.now(), pts = [];
  const map = new Map(daily.filter(x => x.cur === cur).map(x => [x.d, x.s]));
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now - i * 864e5).toISOString().slice(0, 10);
    pts.push([d, map.get(d) || 0]);
  }
  const W = 640, H = 220, P = {l: 6, r: 6, t: 18, b: 22};
  const vmax = Math.max(1, ...pts.map(p => p[1])), bw = (W - P.l - P.r) / days;
  let g = `<line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="var(--grid)"/>`;
  pts.forEach(([d, v], i) => {
    if (!v) return;
    const h = Math.max(2, v / vmax * (H - P.t - P.b));
    g += `<rect x="${P.l + i * bw + .5}" y="${H - P.b - h}" width="${Math.max(1.5, bw - 1.5)}" height="${h}" rx="1.5" fill="var(--acc)" data-tt="${d.slice(8, 10)}.${d.slice(5, 7)} · ${v} ${cur === "XTR" ? "⭐" : esc(cur)}"/>`;
  });
  g += `<text x="${P.l}" y="${H - 4}" font-size="9" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">${pts[0][0].slice(5)}</text>
        <text x="${W - P.r}" y="${H - 4}" text-anchor="end" font-size="9" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">сегодня</text>
        <text x="${W - P.r}" y="11" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">макс/день ${vmax}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function equitySVG(eq, H = 250, id = "eq") {

  const X = i => P.l + i * (W - P.l - P.r) / (eq.length - 1);
  const Y = v => P.t + (yMax - v) * (H - P.t - P.b) / (yMax - yMin || 1);

    <stop offset="0" stop-color="var(--pos)" stop-opacity=".14"/>

  const pts = eq.map((p, i) => X(i).toFixed(1) + " " + Y(p.r).toFixed(1));

  g += `<path d="${path}" fill="none" stroke="var(--pos)" stroke-width="2" stroke-linejoin="round"${id === "eq" ? ' class="eqline"' : ""}/>`;

function ddSVG(eq) {

function histSVG(tr) {
  if (!tr.length) return `<div class="warn" style="padding:24px 8px">нет данных</div>`;
  const edges = [-1.01, -0.5, 0, 0.5, 1, 2, 3, 1e9];
  const labels = ["−1", "−1…−.5", "−.5…0", "0….5", ".5…1", "1…2", "2…3", "3+"];
  const bins = new Array(labels.length).fill(0);
  for (const x of tr) {
    if (x.r <= -1) { bins[0]++; continue; }
    for (let i = 1; i < edges.length; i++) if (x.r <= edges[i]) { bins[i]++; break; }
  }
  const W = 640, H = 180, P = {l: 8, r: 8, t: 18, b: 24};
  const maxN = Math.max(...bins, 1), bw = (W - P.l - P.r) / bins.length - 8;
  let g = "";
  bins.forEach((n, i) => {
    const x = P.l + (i + .5) * (W - P.l - P.r) / bins.length - bw / 2;
    const hgt = Math.max(n / maxN * (H - P.t - P.b), n ? 4 : 1);
    const y = H - P.b - hgt, neg = i <= 2;
    g += `<rect x="${x}" y="${y}" width="${bw}" height="${hgt}" rx="4" fill="var(--${neg ? "neg" : "pos"})" opacity="${n ? 1 : .22}"/>
      ${n ? `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" font-size="10.5" font-weight="600" font-family="IBM Plex Mono,monospace" fill="var(--ink)">${n}</text>` : ""}
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="9" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// --- симулятор депозита: сложный процент по закрытым сделкам журнала ---
let SIM_RISK = 2, SIM_COSTS = true;
const COST_FEE = 0.055, COST_SLIP = 0.02, COST_FUND_8H = 0.01;   // %, модель бэктеста
function netR(rs, sps, hh) {
  // издержки в R: (2×комиссия + слип)/ход до стопа% + фандинг×часы/8/ход;
  // сделки без филла (expired, R=0) издержек не несут
  return rs.map((r, i) => {
    if (!sps[i] || (r === 0 && !(hh[i] > 0))) return r;
    const pct = 2 * COST_FEE + COST_SLIP + COST_FUND_8H * ((hh[i] || 0) / 8);
    return r - pct / sps[i];
  });
}
const fmtUsd = v => "$" + (v >= 1000
  ? v.toLocaleString("en-US", {maximumFractionDigits: 0})
  : v.toFixed(v >= 100 ? 0 : 2));
function simCompute(rs, riskPct) {
  let bal = 100, peak = 100, maxDD = 0;
  const series = [100];
  for (const r of rs) {
    bal = Math.max(0, bal * (1 + riskPct / 100 * r));
    peak = Math.max(peak, bal);
    if (peak > 0) maxDD = Math.max(maxDD, (peak - bal) / peak * 100);
    series.push(+bal.toFixed(2));
  }
  return {bal, pct: (bal / 100 - 1) * 100, maxDD, series};
}
function simSVG(series) {
  if (series.length < 2) return "";
  const W = 640, H = 190, P = {l: 8, r: 62, t: 12, b: 8};
  const yMin = Math.min(...series), yMax = Math.max(...series);
  const X = i => P.l + i * (W - P.l - P.r) / (series.length - 1);
  const Y = v => P.t + (yMax - v) * (H - P.t - P.b) / (yMax - yMin || 1);
  const good = series[series.length - 1] >= 100;
  const col = good ? "var(--pos)" : "var(--neg)";
  let g = `<defs><linearGradient id="simfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${col}" stop-opacity=".16"/>
    <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  for (let k = 0; k <= 2; k++) {
    const v = yMin + k * (yMax - yMin) / 2, y = Y(v);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>
          <text x="${W - P.r + 6}" y="${y + 4}" font-size="10" font-family="IBM Plex Mono,monospace" fill="var(--ink-3)">${fmtUsd(v)}</text>`;
  }
  if (yMin < 100 && yMax > 100)
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--zero)" stroke-dasharray="3 3"/>`;
  const pts = series.map((v, i) => X(i).toFixed(1) + " " + Y(v).toFixed(1));
  const path = "M" + pts.join("L");
  g += `<path d="${path}L${X(series.length - 1)} ${Y(yMin)}L${X(0)} ${Y(yMin)}Z" fill="url(#simfade)"/>`;
  g += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  g += `<circle cx="${X(series.length - 1)}" cy="${Y(series[series.length - 1])}" r="3.5" fill="${col}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function renderTradeChart(d) {

    grid: {vertLines: {color: "rgba(139,147,167,.07)"}, horzLines: {color: "rgba(139,147,167,.07)"}},
    timeScale: {timeVisible: true, secondsVisible: false, borderColor: "rgba(139,147,167,.2)"},
    rightPriceScale: {borderColor: "rgba(139,147,167,.2)"},

  CHART = chart;
  const prec = pxPrec(d.entry);
  const sr = chart.addCandlestickSeries({

    wickUpColor: "#1f9e6e", wickDownColor: "#f6465d",
    priceFormat: {type: "price", precision: prec, minMove: Math.pow(10, -prec)},

  sr.setData(d.candles.map(c => ({time: c[0], open: c[1], high: c[2], low: c[3], close: c[4]})));
  const line = (px, color, title, style) => px && sr.createPriceLine(

  line(d.entry, "#f7a600", "вход");

  if (tF) mk.push({time: snap(tF), position: d.side === "LONG" ? "belowBar" : "aboveBar",
                   color: "#f7a600", shape: d.side === "LONG" ? "arrowUp" : "arrowDown", text: "вход"});
  if (tC && !d.open) mk.push({time: snap(tC), position: d.side === "LONG" ? "aboveBar" : "belowBar",
                   color: d.result_r >= 0 ? "#1f9e6e" : "#f6465d",
                   shape: d.side === "LONG" ? "arrowDown" : "arrowUp", text: fmtR(d.result_r)});
  sr.setMarkers(mk);
  chart.timeScale().fitContent();
}
let CHART_CLR = 0;
function closeChart() {
  const m = $("#chartModal");
  if (!m.classList.contains("show")) return;
  m.classList.remove("show"); syncBack();
  clearTimeout(CHART_CLR);
  CHART_CLR = setTimeout(() => {                         // чистим ПОСЛЕ угасания — без пустой вспышки
    if (CHART) { try { CHART.remove(); } catch (_) {} CHART = null; }
    $("#chartBody").innerHTML = "";
  }, 200);
}
document.addEventListener("click", e => {
  if (e.target.closest("#chartClose") || e.target === $("#chartModal")) closeChart();
});

// навигация по вкладкам
document.addEventListener("click", e => {
  const ch = e.target.closest("[data-chart]");
  if (ch) { openChart(ch.dataset.chart); return; }
  const rk = e.target.closest("[data-risk]");
  if (rk) { hap("sel"); SIM_RISK = +rk.dataset.risk; render(true); return; }
  const cf = e.target.closest("[data-cf]");
  if (cf) { hap("sel"); CLOSED_FILTER = cf.dataset.cf; render(true); return; }
  if (e.target.closest("[data-costs]")) { SIM_COSTS = !SIM_COSTS; render(true); return; }
  const nb = e.target.closest("[data-nav]");
  if (nb) {
    if (nb.dataset.nav !== curNav()) { NAV = nb.dataset.nav; store.set("nav", NAV); SWAP = true; hap("sel"); render(true); }
    window.scrollTo({top: 0, behavior: REDUCED ? "auto" : "smooth"});
    return;
  }
  const an = e.target.closest("[data-anav]");
  if (an) {
    if (an.dataset.anav !== ANAV) { ANAV = an.dataset.anav; store.set("anav", ANAV); SWAP = true; hap("sel"); render(true); }
    an.scrollIntoView({block: "nearest", inline: "center", behavior: REDUCED ? "auto" : "smooth"});
    return;
  }
  const ep = e.target.closest("[data-eqp]");
  if (ep) { hap("sel"); EQP = ep.dataset.eqp; store.set("eqp", EQP); render(true); return; }
  const trf = e.target.closest("[data-trf]");
  if (trf) { hap("sel"); TR[trf.dataset.trf] = trf.dataset.v; trLoad(true); return; }
  if (e.target.closest("[data-trmore]")) { trLoad(false); return; }
  const ust = e.target.closest("[data-aust]");
  if (ust) { hap("sel"); AU.st = ust.dataset.aust; AU.items = null; auLoad(); render(true); return; }
  const usr = e.target.closest("[data-user]");
  if (usr && ME && ME.admin) { openUser(+usr.dataset.user); return; }
  const ua = e.target.closest("[data-uact]");
  if (ua && ME && ME.admin) {
    const id = +ua.dataset.uid, days = Math.trunc(Number(String(($("#s-days") || {}).value || "30").replace(",", "."))) || 30;
    userAction(id, ua.dataset.uact, days, () => openUser(id));
    return;
  }
  const asv = e.target.closest("[data-asv]");
  if (asv) { hap("sel"); AS.view = asv.dataset.asv; asLoad(true); render(true); return; }
  if (e.target.closest("[data-asmore]")) { asLoad(false); render(true); return; }
  if (e.target.closest("[data-axrefresh]")) { axLoad(); toast("обновляю…"); return; }
  const mc = e.target.closest("[data-mcur]");
  if (mc) { hap("sel"); MCUR = mc.dataset.mcur; render(true); return; }
  if (e.target.closest("#sheetClose") || e.target === $("#sheet")) { closeSheet(); return; }
  if (e.target.closest("[data-aff]") && ME && ME.affiliate) {
    hap("sel");
    if (inTg && tg.openLink) tg.openLink(ME.affiliate); else window.open(ME.affiliate, "_blank");
    return;
  }
  const op = e.target.closest("[data-open]");
  if (op && ME && ME.bot) {
    const url = `https://t.me/${ME.bot}?start=${op.dataset.open}`;
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
    return;
  }
  const rf = e.target.closest("[data-ref]");
  if (rf && ME && ME.referral) {
    const link = ME.referral.link;
    if (rf.dataset.ref === "copy") {
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
        .then(() => { toast("Ссылка скопирована"); hap("ok"); })
        .catch(() => { const el = $("#reflink"); el.select(); toast("Выделено — скопируй"); });
    } else if (inTg && tg.openTelegramLink) {
      tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(link)
        + "&text=" + encodeURIComponent("Сигналы RSI Range — открытый трек-рекорд, каждая сделка в журнале"));
    }
    return;
  }
  const pz = e.target.closest("[data-pause]");
  if (pz && ME && ME.admin) {
    const on = pz.dataset.pause === "1";
    const q = on ? "Поставить сигналы на паузу? Открытые сделки продолжат вестись." : "Возобновить поиск сигналов?";
    const go = () => admSet("paused", on, pz);
    if (tg && tg.showConfirm) tg.showConfirm(q, ok => { if (ok) go(); }); else if (window.confirm(q)) go();
    return;
  }
  if (e.target.closest("[data-calcsave]")) {
    const c = calcState();
    prefsPost({depo_usd: c.usd, risk_pct: c.risk}, "Сохранено — личные сигналы бота посчитают объём");
    return;
  }
  const pm = e.target.closest(".tgl[data-pref]");
  if (pm && ME && ME.notify) {
    const muted = pm.classList.contains("on");          // было «вкл» -> выключаем пуши
    prefsPost({muted}, muted ? "Пуши сигналов выключены" : "Пуши сигналов включены");
    return;
  }
  const tglEl = e.target.closest(".tgl[data-set]");
  if (tglEl && ME && ME.admin) {
    admSet(tglEl.dataset.set, !tglEl.classList.contains("on"), tglEl);
    tglEl.classList.toggle("on");
    return;
  }
  const act = e.target.closest("[data-act]");
  if (act && ME && ME.admin) {
    const id = parseInt(($("#g-id") || {}).value, 10);
    const days = Math.trunc(Number(String(($("#g-days") || {}).value).replace(",", "."))) || 30;
    if (!id) { toast("Укажи tg_id"); return; }
    const doAction = () => fetch("api/admin/user", {method: "POST", headers: authHdr(),
      body: JSON.stringify({tg_id: id, action: act.dataset.act, days})})
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        toast(d && d.ok ? (act.dataset.act === "grant" ? `Выдано ${days}д для ${id}` : `Снято у ${id}`)
                        : "Отклонено");
        admFetch().then(() => render(true));
      })
      .catch(() => toast("Сеть недоступна"));
    if (act.dataset.act === "revoke") {
      // необратимое одним тапом + опечатка в tg_id = чужая снятая подписка (аудит 02.09)
      const q = `Снять подписку у ${id}?`;
      if (tg.showConfirm) tg.showConfirm(q, ok => { if (ok) doAction(); });
      else if (window.confirm(q)) doAction();
    } else doAction();
    return;
  }
});

let inputT = 0;
document.addEventListener("input", e => {
  const id = e.target.id;
  const clean = v => v.replace(/[^A-Za-z0-9]/g, "").slice(0, 15);
  if (id === "trq") { clearTimeout(inputT); inputT = setTimeout(() => { TR.q = clean(e.target.value); trLoad(true); }, 350); }
  else if (id === "auq") { clearTimeout(inputT); inputT = setTimeout(() => { AU.q = e.target.value.trim().slice(0, 40); AU.items = null; auLoad(); }, 350); }
  else if (id === "asq") { clearTimeout(inputT); inputT = setTimeout(() => { AS.q = clean(e.target.value); asLoad(true); }, 350); }
  else if (id === "calcUsd" || id === "calcRisk") {
    const c = calcState(), v = Number(String(e.target.value).replace(",", "."));
    if (isFinite(v) && v > 0) {
      if (id === "calcUsd") { c.usd = v; store.set("calc.usd", v); } else { c.risk = Math.min(v, 10); store.set("calc.risk", c.risk); }
      clearTimeout(inputT); inputT = setTimeout(() => render(true), 250);
    }
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("select[data-pref]");
  if (!el || !(ME && ME.notify)) return;
  const qs = ($('select[data-pref="quiet_start"]') || {}).value, qe = ($('select[data-pref="quiet_end"]') || {}).value;
  if ((qs === "") !== (qe === "")) return;              // ждём вторую границу
  prefsPost(qs === "" ? {quiet_start: null, quiet_end: null} : {quiet_start: +qs, quiet_end: +qe},
            qs === "" ? "Тихие часы выключены" : `Тихие часы ${qs}:00–${qe}:00 UTC`);
});
function prefsPost(body, okMsg) {
  fetch("api/prefs", {method: "POST", headers: authHdr(), body: JSON.stringify(body)})
    .then(r => r.json().catch(() => null).then(d => [r.ok, d]))
    .then(([ok, d]) => {
      if (ok && d && d.ok) { ME.depo = d.depo; ME.notify = d.notify; toast(okMsg); hap("ok"); }
      else { toast((d && d.err) || "Не сохранилось — переоткрой дашборд"); hap("err"); }
      render(true);
    }).catch(() => toast("Сеть недоступна"));
}
// подсказки [data-tt] (календарь, выручка): наведение мышью и тап пальцем
function ttShow(ev) {
  const c = ev.target.closest && ev.target.closest("[data-tt]"), tip = $("#tip");
  if (!c) { if (!(ev.target.closest && ev.target.closest("#eq"))) tip.style.opacity = "0"; return; }
  tip.textContent = c.dataset.tt;
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - 160) + "px";
  tip.style.top = (ev.clientY - 36) + "px"; tip.style.opacity = "1";
}
document.addEventListener("pointermove", e => { if (e.target.closest && e.target.closest("[data-tt]")) ttShow(e); });
document.addEventListener("pointerdown", ttShow);
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closeChart(); } });

// числа/выбор/URL в настройках — сохранение на change
document.addEventListener("change", e => {
  const el = e.target.closest("[data-set]");
  if (!el || !(ME && ME.admin) || el.classList.contains("tgl")) return;
  const t = el.dataset.t;
  let v = el.value;
  if (t === "int" || t === "float") {
    v = Number(String(v).trim().replace(",", "."));   // «0,5» с русской клавиатуры
    if (!isFinite(v)) { toast("Не число"); render(true); return; }
    if (t === "int") v = Math.trunc(v);
  }
  admSet(el.dataset.set, v, el);
});

// тап по строке с data-sid — переключить «я в этой сделке» (только платный слой).
// PENDING переживает ре-рендеры (busy рисуется из него), поколение gen отбрасывает
// устаревшие ответы при гонке двух тапов, !r.ok — честный алерт вместо тихого отката.
document.addEventListener("click", e => {
  if (e.target.closest("#shareCard")) {
    e.preventDefault();
    if (ME && ME.bot && inTg) tg.openTelegramLink(`https://t.me/${ME.bot}?start=mycard`);
    return;
  }
  if (e.target.closest("[data-chart]")) return;     // тап по графику — не отметка
  const tr = e.target.closest("[data-sid]");
  if (!tr || !(ME && ME.private) || !inTg) return;
  const sid = +tr.dataset.sid;
  if (PENDING.has(sid)) return;
  const on = !(ME.taken || []).includes(sid);
  PENDING.add(sid);
  const gen = ++takeGen;
  tr.classList.add("busy");
  fetch("api/take", {method: "POST",
    headers: {"Authorization": "tma " + tg.initData, "Content-Type": "application/json"},
    body: JSON.stringify({signal_id: sid, taken: on})})
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      PENDING.delete(sid);
      if (d && d.ok) {
        if (gen === takeGen) { ME.taken = d.taken; ME.my_stats = d.my_stats; hap("light"); }
      } else if (tg && tg.showAlert) {
        try { tg.showAlert("Отметка не сохранилась — переоткрой дашборд"); } catch (e2) {}
      }
      render(true);
    })
    .catch(() => { PENDING.delete(sid); render(true); });
});
</script>

</div>

  <div class="cm-box">
    <div class="cm-head" id="chartHead"></div>
    <div class="cm-body" id="chartBody"></div>

  </div>
</div>
