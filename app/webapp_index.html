<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>RSI Range — живой терминал</title>
<meta property="og:title" content="RSI Range — живой терминал">
<meta property="og:description" content="Прозрачный трек-рекорд крипто-фьючерс сигналов: эквити в R, winrate, открытые позиции. Каждая сделка — в проверяемом журнале (CSV + SHA-256). Не финансовый совет. 18+">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="description" content="Прозрачный трек-рекорд крипто-фьючерс сигналов RSI Range. Не финансовый совет. 18+">
<meta name="theme-color" content="#08090b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="lwc.js" as="script">
<style>
/* v7 «тёмный терминал» (29.10.2026, редизайн по запросу владельца). Тёмная тема ВСЕГДА —
   как у бирж (решение 14.08); единственный акцент — оранжевый бренда, им не красим данные.
   Данные — пара #1f9e6e/#f6465d: прошла CVD-валидатор на поверхности #0f1115 (deutan
   ΔE 7.1 — легально, потому что везде вторичное кодирование: знак +/−, ▲/▼, подпись
   исхода «тейк/стоп»). Более яркая пара #2fc38a/#ff6b7d провалила deutan (ΔE 2.7).
   Сетка 4/8, радиусы 22/18/14/10, движения 150–300 мс на ease-out, без пружин. */
:root{
  color-scheme:dark;
  --bg:#08090b; --s1:#0f1115; --s2:#15181d; --s3:#1c2026; --s4:#262b32;
  --line:rgba(255,255,255,.065); --line2:rgba(255,255,255,.042); --hi:rgba(255,255,255,.035);
  --ink:#eef0f3; --ink2:#a3abb6; --ink3:#6c7480; --ink4:#4a515b;
  --acc:#f7a600; --acc-soft:rgba(247,166,0,.12); --acc-line:rgba(247,166,0,.42);
  --pos:#1f9e6e; --neg:#f6465d; --pos-soft:rgba(31,158,110,.14); --neg-soft:rgba(246,70,93,.13);
  --zero:#3a414a;
  --r-xl:22px; --r-lg:18px; --r-md:14px; --r-sm:10px;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  /* безопасные зоны: вырез/«домик» iOS + полноэкранный режим Telegram (Bot API 8.0
     выставляет --tg-*-safe-area-inset-* на :root через telegram-web-app.js) */
  --safe-t:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --font:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}   /* clip, не hidden: hidden делает body контейнером прокрутки и ломает sticky */
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding-bottom:calc(100px + var(--safe-b));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:380px;pointer-events:none;z-index:0;
  background:radial-gradient(520px 240px at 92% -70px,rgba(247,166,0,.075),transparent 70%)}
button{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--pos)} .dn{color:var(--neg)} .mut{color:var(--ink3)}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + var(--safe-t)) 16px 10px;
  display:flex;align-items:center;gap:10px;background:rgba(8,9,11,.84);
  -webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);
  border-bottom:1px solid transparent;transition:border-color .2s ease}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:24px;height:24px;border-radius:8px;flex:0 0 auto;position:relative;
  background:linear-gradient(145deg,#ffbd2e,#f7a600 55%,#e08f00);
  box-shadow:0 6px 16px -6px rgba(247,166,0,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.mark::before,.mark::after{content:"";position:absolute;left:6px;right:6px;height:2px;border-radius:1px;
  background:rgba(26,18,4,.82)}
.mark::before{top:8px} .mark::after{bottom:8px}
.brand b{display:block;font:700 13px/1 var(--font);letter-spacing:.15em}
.brand small{display:block;font:500 10.5px/1 var(--font);color:var(--ink3);margin-top:4px;letter-spacing:.01em}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;
  border-radius:999px;background:var(--s1);border:1px solid var(--line);cursor:pointer;
  font:500 11.5px/1 var(--font);color:var(--ink2);white-space:nowrap;
  transition:transform 160ms var(--ease-out),border-color .15s ease}
.live i{width:7px;height:7px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 3px rgba(247,166,0,.16);animation:pulse 2.4s ease-in-out infinite}
.live.busy i{animation-duration:.6s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- сегменты / чипы ---------- */
.seg{position:relative;display:flex;background:var(--s1);border:1px solid var(--line);border-radius:13px;
  padding:3px;margin-top:12px}
.seg.sm{margin:0;border-radius:11px;padding:2px;background:var(--s2)}
.seg button{position:relative;z-index:1;flex:1;height:32px;border:0;background:none;cursor:pointer;
  color:var(--ink3);font:600 12.5px/1 var(--font);border-radius:10px;white-space:nowrap;padding:0 10px;
  transition:color .2s ease}
.seg.sm button{height:26px;font-size:11.5px;border-radius:9px;padding:0 9px}
.seg button.on{color:var(--ink)}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;border-radius:10px;
  width:calc((100% - 6px) / var(--n));transform:translateX(calc(var(--i) * 100%));
  background:var(--s3);box-shadow:0 1px 2px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform 280ms var(--ease-io)}
.seg.sm .thumb{top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:9px;background:var(--s4)}
.filters{display:flex;gap:8px;margin:0 0 6px}
.filters .seg{flex:1;min-width:0}
.filters .seg:last-child{flex:1.35}
.filters .seg button{padding:0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border-radius:999px;border:1px solid var(--line);background:var(--s2);color:var(--ink2);cursor:pointer;
  font:600 12px/1 var(--font);white-space:nowrap;user-select:none;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform 160ms var(--ease-out)}
.chip.on{background:var(--acc-soft);border-color:var(--acc-line);color:var(--acc)}
.chip .cnt{font:600 10.5px/1 var(--font);color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
  background:var(--s2);border:1px solid var(--line);color:var(--ink2);font:600 12px/1 var(--font);
  white-space:nowrap}
.pill.pos{background:var(--pos-soft);border-color:transparent;color:var(--pos)}
.pill.neg{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.pill.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.pill.ghost{background:transparent}

/* ---------- карточки ---------- */
.card,section{position:relative;display:block;background:var(--s1);border:1px solid var(--line);
  border-radius:var(--r-xl);padding:16px;margin-top:12px;box-shadow:inset 0 1px 0 var(--hi)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:24px}
.card-h h3{font:600 15.5px/1.2 var(--font);letter-spacing:-.012em}
.card-h .aside{margin-left:auto;font:500 12px/1.2 var(--font);color:var(--ink3);text-align:right}
.card-h .aside.chips-in{display:flex;gap:6px}
.foot-note{font:500 12px/1.5 var(--font);color:var(--ink3);margin-top:12px}
.foot-note b{color:var(--ink2);font-weight:600}
/* legacy-оболочка админки: h2 в КАПСЕ — подписью-«бровью» */
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:22px}
.sec-h h2{font:600 11px/1.2 var(--font);letter-spacing:.09em;color:var(--ink2);text-transform:uppercase}
.sec-h .note{font:500 11.5px/1.2 var(--font);color:var(--ink3);margin-left:auto;text-align:right}

/* ---------- герой ---------- */
.hero{padding:18px 0 0;overflow:hidden}
/* едва заметное свечение по знаку итога — данные, а не декор: зелёное в плюсе, красное в минусе */
.hero.g-up{background:radial-gradient(420px 220px at 100% 0,rgba(31,158,110,.11),transparent 62%),var(--s1)}
.hero.g-dn{background:radial-gradient(420px 220px at 100% 0,rgba(246,70,93,.10),transparent 62%),var(--s1)}
.hero-in{padding:0 18px}
.eyebrow{display:flex;align-items:center;gap:8px;font:500 12.5px/1.2 var(--font);color:var(--ink2)}
.eyebrow .sep{width:3px;height:3px;border-radius:50%;background:var(--ink4)}
.hero-num{font:700 54px/1.02 var(--font);letter-spacing:-.045em;margin-top:10px;white-space:nowrap}
.hero-num.up{color:var(--pos)} .hero-num.dn{color:var(--neg)}
.hero-num .u{font-size:.56em;letter-spacing:-.02em;margin-left:3px;font-weight:650}
.hero-num .cur{font-size:.6em;font-weight:650;color:var(--ink2);margin-right:2px;vertical-align:.32em}
.hero-num .c{font-size:.5em;font-weight:600;color:var(--ink3);letter-spacing:-.02em}
.hero-sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero-chart{position:relative;height:236px;margin-top:12px}
.hero-chart .lwc{position:absolute;left:0;right:0;top:24px;bottom:0}
.chart-read{position:absolute;left:18px;top:0;z-index:3;pointer-events:none;
  font:600 12px/1.2 var(--font);color:var(--ink3);white-space:nowrap}
.chart-read b{color:var(--ink);font-weight:650}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px 14px;border-top:1px solid var(--line2)}
.hero-foot .meta{font:500 12px/1.3 var(--font);color:var(--ink3);text-align:right}
.hero-foot .meta b{color:var(--ink2);font-weight:600}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  font:500 12.5px/1.5 var(--font);color:var(--ink3);padding:0 24px}

/* ---------- плитки KPI ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 13px;
  box-shadow:inset 0 1px 0 var(--hi);min-height:108px;display:flex;flex-direction:column;min-width:0}
.kpi .k{display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--font);color:var(--ink3)}
.kpi .k svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi .v{font:650 27px/1.05 var(--font);letter-spacing:-.035em;margin-top:9px;white-space:nowrap}
.kpi .s{font:500 11.5px/1.35 var(--font);color:var(--ink3);margin-top:auto;padding-top:8px}
.kpi .s b{color:var(--ink2);font-weight:600}
.split{display:flex;gap:2px;height:6px;margin-top:10px;border-radius:3px;overflow:hidden}
.split i{display:block;height:100%;border-radius:3px;min-width:3px}
.split .w{background:var(--pos)} .split .l{background:var(--neg)} .split .p{background:var(--zero)}

/* ---------- строки сделок ---------- */
.rows{margin:0 -6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;cursor:pointer;
  position:relative;transition:background-color .15s ease}
.row + .row::before{content:"";position:absolute;left:54px;right:6px;top:0;height:1px;background:var(--line2)}
.row.nohit{cursor:default}
.ava{position:relative;width:38px;height:38px;flex:0 0 auto;border-radius:12px;background:var(--s3);
  display:grid;place-items:center;font:700 11px/1 var(--font);letter-spacing:.02em;color:var(--ink2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ava .sd{position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;border-radius:50%;
  display:grid;place-items:center;font-size:7.5px;line-height:1;background:var(--s1);
  box-shadow:0 0 0 2px var(--s1)}
.ava .sd.l{color:var(--pos)} .ava .sd.s{color:var(--neg)}
.row .mid{flex:1;min-width:0}
.row .t1{display:flex;align-items:center;gap:6px;font:600 14.5px/1.2 var(--font);letter-spacing:-.01em;white-space:nowrap}
.row .t2{font:500 12px/1.2 var(--font);color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:6px;background:var(--s3);
  font:600 10.5px/1 var(--mono);color:var(--ink2);letter-spacing:.02em}
.oc{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.oc b{font:650 14.5px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.oc i{font:700 9.5px/1 var(--font);font-style:normal;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 6px 3px;border-radius:6px}
.oc.pos b{color:var(--pos)} .oc.pos i{color:var(--pos);background:var(--pos-soft)}
.oc.neg b{color:var(--neg)} .oc.neg i{color:var(--neg);background:var(--neg-soft)}
.oc.zero b{color:var(--ink2)} .oc.zero i{color:var(--ink2);background:var(--s3)}
.oc .sub{font:500 11.5px/1 var(--font);color:var(--ink3)}
.st-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;
  font:600 11px/1 var(--font);white-space:nowrap;background:var(--s3);color:var(--ink2)}
.st-pill i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.st-pill.live i{background:var(--acc);box-shadow:0 0 0 3px rgba(247,166,0,.16)}
.more-row{display:flex;justify-content:center;margin-top:10px}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--acc);background:none;border:0;cursor:pointer;
  font:600 13px/1 var(--font);padding:6px 4px;text-decoration:none}
.lnk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- месяцы / календарь / аналитика ---------- */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo{position:relative;border-radius:14px;padding:11px 11px 10px;background:var(--s2);overflow:hidden;
  border:1px solid var(--line2);min-width:0}
.mo::before{content:"";position:absolute;inset:0;opacity:var(--a,0);pointer-events:none}
.mo.p::before{background:linear-gradient(160deg,var(--pos-soft),rgba(31,158,110,.02))}
.mo.n::before{background:linear-gradient(160deg,var(--neg-soft),rgba(246,70,93,.02))}
.mo > *{position:relative}
.mo .m{font:600 11.5px/1 var(--font);color:var(--ink2);display:flex;align-items:center;gap:5px}
.mo .m em{font-style:normal;font:600 9.5px/1 var(--font);color:var(--acc);letter-spacing:.04em}
.mo .r{font:650 18px/1 var(--font);letter-spacing:-.03em;margin-top:9px;white-space:nowrap}
.mo .n{font:500 11px/1.2 var(--font);color:var(--ink3);margin-top:6px;white-space:nowrap}
.cal{display:block;width:100%}
.cal-leg{display:flex;align-items:center;gap:4px;font:500 11px/1 var(--font);color:var(--ink3);margin-top:10px}
.cal-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sim-hero{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:2px 0 6px}
.sim-start{font:600 15px/1 var(--font);color:var(--ink3)}
.sim-bal{font:700 36px/1 var(--font);letter-spacing:-.04em}
.coins{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.coins::-webkit-scrollbar{display:none}
.coin{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;min-width:108px;padding:10px 12px;
  border-radius:14px;background:var(--s2);border:1px solid var(--line2)}
.coin .c1{display:flex;align-items:center;justify-content:space-between;gap:8px;font:650 12.5px/1 var(--font)}
.coin .c2{font:600 14px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--ink)}
.coin .c3{font:600 11px/1 var(--font)}
.ana-body{margin-top:12px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td{padding:9px 2px;border-top:1px solid var(--line2);font:500 13px/1.2 var(--font)}
.tbl tr:first-child td{border-top:0}
.tbl .r{text-align:right} .tbl .d{color:var(--ink3);font-size:12px}
.tbl .b{font-weight:650}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
svg{display:block;width:100%}
.plot{margin-top:4px}

/* ---------- счёт ---------- */
.acct .hero-num{color:var(--ink)}
.bal-cents{opacity:.55}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.set:first-of-type{border-top:0;padding-top:2px}
.set .lbl{flex:1;min-width:0;font:600 13.5px/1.3 var(--font)}
.set .lbl small{display:block;font:500 12px/1.4 var(--font);color:var(--ink3);margin-top:3px}
.fld{padding:4px 0 14px}
.fld > label{display:block;font:600 13px/1.3 var(--font);color:var(--ink2);margin-bottom:8px}
.fld > label small{font:500 12px/1.3 var(--font);color:var(--ink3)}
.fld .risk-chips{justify-content:flex-start}
.money-inp{display:flex;align-items:center;height:46px;border-radius:13px;background:var(--s2);
  border:1px solid var(--line);padding:0 14px;gap:6px;width:100%;transition:border-color .15s ease}
.money-inp:focus-within{border-color:var(--acc-line)}
.money-inp span{color:var(--ink3);font:600 15px/1 var(--font)}
.money-inp input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);
  font:650 15px/1 var(--font);font-variant-numeric:tabular-nums}
.risk-chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.risk-chips .chip{height:32px;padding:0 11px}
.actions{display:flex;align-items:center;gap:10px;margin-top:14px}
.empty-state{text-align:center;padding:32px 22px 26px}
.es-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;
  background:var(--acc-soft);color:var(--acc)}
.es-ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty-state h3{font:650 18px/1.25 var(--font);letter-spacing:-.02em}
.empty-state p{font:500 13.5px/1.55 var(--font);color:var(--ink2);margin:8px auto 18px;max-width:320px}
.bars-wrap{position:relative}

/* ---------- кнопки / поля / тумблеры ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;
  border-radius:13px;border:1px solid var(--line);background:var(--s2);color:var(--ink);cursor:pointer;
  font:600 13.5px/1 var(--font);white-space:nowrap;
  transition:transform 160ms var(--ease-out),background-color .15s ease,border-color .15s ease,opacity .15s}

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;

const tgAtLeast = v => { try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch (e) { return false; } };

function applyChrome() {
  if (!inTg) return;
  try { if (tgAtLeast("6.9")) tg.setHeaderColor(BG); } catch (e) {}
  try { if (tgAtLeast("6.1")) tg.setBackgroundColor(BG); } catch (e) {}

}

  try { tg.ready(); tg.expand(); } catch (e) {}
  applyChrome();
  try { tg.onEvent("themeChanged", applyChrome); } catch (e) {}
}

  get(k, d) { try { const v = localStorage.getItem("rsi." + k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("rsi." + k, v); } catch (e) {} },
};

const ava = (sym, side) => { const s = String(sym), t = (s.replace(/^\d+/, "") || s).slice(0, 4);

// исход закрытой: тейк / трейл (стоп в плюсе — подтянутый стоп) / б/у / стоп. Статус и так
// публичен в CSV /trackrecord; знак R и подпись — вторичное кодирование поверх цвета
function outcome(o) {

  return r > 0 ? ["плюс", "pos"] : r < 0 ? ["минус", "neg"] : ["ноль", "zero"];
}

function derive(eq) {
  const tr = []; let prev = 0;
  for (const p of eq) { tr.push({t: p.t, r: +(p.r - prev).toFixed(2)}); prev = p.r; }
  const wins = tr.filter(x => x.r > 0), losses = tr.filter(x => x.r <= 0);
  const wSum = wins.reduce((s, x) => s + x.r, 0), lSum = losses.reduce((s, x) => s + x.r, 0);
  let peak = 0, dd = 0, cum = 0;
  for (const x of tr) { cum += x.r; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); }
  const weeks = new Map();
  for (const x of tr) {
    const d = new Date(x.t + "T00:00Z"), y = new Date(d);
    y.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    const k = y.toISOString().slice(5, 10);
    weeks.set(k, +(((weeks.get(k) || 0) + x.r)).toFixed(2));
  }
  const months = new Map();
  for (const x of tr) {
    const k = x.t.slice(0, 7);
    const m = months.get(k) || {n: 0, w: 0, r: 0};
    m.n++; if (x.r > 0) m.w++; m.r = +(m.r + x.r).toFixed(2);
    months.set(k, m);
  }
  let ws = 0, ls = 0, maxWs = 0, maxLs = 0;
  for (const x of tr) {
    if (x.r > 0) { ws++; ls = 0; } else { ls++; ws = 0; }
    maxWs = Math.max(maxWs, ws); maxLs = Math.max(maxLs, ls);
  }
  return {tr, pf: lSum ? Math.abs(wSum / lSum) : (wSum ? 99 : 0), maxDD: dd,
          weeks: [...weeks.entries()].slice(-8), last: tr.slice(-10),
          months: [...months.entries()].slice(-6),
          avgWin: wins.length ? wSum / wins.length : 0,
          avgLoss: losses.length ? lSum / losses.length : 0, maxWs, maxLs};
}

// эквити -> дневные точки для оси времени (последний итог дня) от нуля на старте периода:
// 30/90д пересчитаны от нуля на дату отсечки — кривая периода, не всей истории
let EQP = store.get("eqp", "all");
const dayBefore = d => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() - 1); return x.toISOString().slice(0, 10); };
function eqDaily(eq, p) {
  if (!eq || !eq.length) return [];
  let base = 0, cut = null;
  if (p !== "all") {
    cut = new Date(Date.now() - (+p) * 864e5).toISOString().slice(0, 10);
    for (const x of eq) if (x.t < cut) base = x.r;
    if (eq.filter(x => x.t >= cut).length < 2) { cut = null; base = 0; }   // мало точек — вся история
  }
  const m = new Map();
  for (const x of eq) if (!cut || x.t >= cut) m.set(x.t, +(x.r - base).toFixed(2));
  const pts = [...m.entries()].map(([time, value]) => ({time, value}));
  // ноль — на старте периода (дата отсечки) либо накануне первой сделки
  if (pts.length) pts.unshift({time: cut && cut < pts[0].time ? cut : dayBefore(pts[0].time), value: 0});
  return pts;
}

function killCharts() { for (const c of CHARTS) { try { c.remove(); } catch (e) {} } CHARTS.clear(); }

// кривая с базой: выше базы — зелёная, ниже — красная (база 0R у эквити, старт $ у счёта)
function mountCurve(el, spec) {
  const chart = LightweightCharts.createChart(el, chartOpts(el, spec.timeVisible));
  const s = chart.addBaselineSeries({
    baseValue: {type: "price", price: spec.base},
    topLineColor: "#1f9e6e", topFillColor1: "rgba(31,158,110,.26)", topFillColor2: "rgba(31,158,110,.02)",
    bottomLineColor: "#f6465d", bottomFillColor1: "rgba(246,70,93,.02)", bottomFillColor2: "rgba(246,70,93,.22)",
    lineWidth: 2, priceLineVisible: false, lastValueVisible: false,
    crosshairMarkerRadius: 4.5, crosshairMarkerBorderColor: "#0f1115", crosshairMarkerBorderWidth: 2,
    priceFormat: {type: "custom", minMove: spec.minMove || 0.01, formatter: spec.fmt},
  });
  s.setData(spec.points);
  s.createPriceLine({price: spec.base, color: "rgba(255,255,255,.16)", lineWidth: 1, lineStyle: 0,
                     axisLabelVisible: false});
  chart.timeScale().fitContent();
  if (spec.read) {
    const show = p => {
      const v = p && p.time != null && p.seriesData ? p.seriesData.get(s) : null;
      spec.read(v ? v.value : null, v ? p.time : null);
    };
    chart.subscribeCrosshairMove(show);
    show(null);
  }
  return chart;
}
function hydrate() {
  const els = [...document.querySelectorAll("#app [data-lwc]")];
  if (!els.length) return;
  const gen = RENDER_GEN;
  loadLWC().then(() => {
    if (gen !== RENDER_GEN) return;
    for (const el of els) {
      const spec = SPECS[el.dataset.lwc];
      if (!spec || !el.isConnected) continue;
      const host = document.createElement("div"); host.className = "lwc"; el.appendChild(host);
      try { CHARTS.add(mountCurve(host, spec)); requestAnimationFrame(() => host.classList.add("ready")); }
      catch (e) { host.remove(); }
    }
  }).catch(() => els.forEach(el => { const s = SPECS[el.dataset.lwc]; if (s && s.fallback) el.insertAdjacentHTML("beforeend", s.fallback()); }));
}
// время точки графика: 'YYYY-MM-DD', BusinessDay {year, month, day} или UNIX-секунды (UTC)
const p2 = n => String(n).padStart(2, "0");
function fmtTime(t) {
  if (typeof t === "string") return `${t.slice(8, 10)}.${t.slice(5, 7)}.${t.slice(2, 4)}`;
  if (t && typeof t === "object") return `${p2(t.day)}.${p2(t.month)}.${String(t.year).slice(2)}`;
  const d = new Date(t * 1000);
  return `${p2(d.getUTCDate())}.${p2(d.getUTCMonth() + 1)} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
}

function countUp(el, from, to, fmt, dur = 760) {
  if (!el) return;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    if (el.isConnected) el.innerHTML = p < 1 ? fmt(from + (to - from) * e) : fmt(to);
    if (p < 1 && el.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);

// симулятор депозита: сложный процент по закрытым сделкам журнала (модель, не счёт юзера)
let SIM_RISK = 2, SIM_COSTS = true;
const SIM_BASE = 1000;
const COST_FEE = 0.055, COST_SLIP = 0.15, COST_FUND_8H = 0.01;   // %, как в /backtest
function netR(rs, sps, hh) {
  // издержки в R: (2×комиссия + слип)/ход до стопа% + фандинг×часы/8/ход;
  // сделки без филла (expired, R=0) издержек не несут
  return rs.map((r, i) => {
    if (!sps[i] || (r === 0 && !(hh[i] > 0))) return r;
    const pct = 2 * COST_FEE + COST_SLIP + COST_FUND_8H * ((hh[i] || 0) / 8);
    return r - pct / sps[i];
  });
}
function simCompute(rs, riskPct) {
  let bal = SIM_BASE, peak = SIM_BASE, maxDD = 0;
  const series = [SIM_BASE];

    peak = Math.max(peak, bal);
    if (peak > 0) maxDD = Math.max(maxDD, (peak - bal) / peak * 100);
    series.push(+bal.toFixed(2));

  return {bal, pct: (bal / SIM_BASE - 1) * 100, maxDD, series};
}

    <div class="foot-note">Модель по закрытым сделкам журнала (порядок закрытий): выходы по часовым свечам, издержки как в /backtest — комиссия тейкера 0.055% на сторону, проскальзывание 0.15%, фандинг 0.01%/8ч по времени в позиции; в R — через ход до стопа каждой сделки. Проверка исполнения по минутным свечам с полными издержками — в минус: /backtest. Не прогноз и не гарантия.</div>

function simSVG(series) {
  if (series.length < 2) return "";
  const W = svgW(), H = 170, P = {l: 4, r: 58, t: 10, b: 8};
  const yMin = Math.min(...series), yMax = Math.max(...series);
  const X = i => P.l + i * (W - P.l - P.r) / (series.length - 1);
  const Y = v => P.t + (yMax - v) * (H - P.t - P.b) / (yMax - yMin || 1);
  const good = series[series.length - 1] >= SIM_BASE, col = good ? "var(--pos)" : "var(--neg)";
  let g = `<defs><linearGradient id="simfade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${good ? "#1f9e6e" : "#f6465d"}" stop-opacity=".2"/>
    <stop offset="1" stop-color="${good ? "#1f9e6e" : "#f6465d"}" stop-opacity="0"/></linearGradient></defs>`;
  for (let k = 0; k <= 2; k++) {
    const v = yMin + k * (yMax - yMin) / 2, y = Y(v);
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.05)"/>
      <text x="${W - P.r + 6}" y="${y + 4}" font-size="10.5" font-family="Inter,sans-serif" fill="#6c7480">${fmtUsd(v)}</text>`;
  }
  if (yMin < SIM_BASE && yMax > SIM_BASE)
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(SIM_BASE)}" y2="${Y(SIM_BASE)}" stroke="rgba(255,255,255,.14)"/>`;
  const path = "M" + series.map((v, i) => X(i).toFixed(1) + " " + Y(v).toFixed(1)).join("L");
  g += `<path d="${path}L${X(series.length - 1)} ${Y(yMin)}L${X(0)} ${Y(yMin)}Z" fill="url(#simfade)"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(series.length - 1)}" cy="${Y(series[series.length - 1])}" r="4" fill="${col}" stroke="#0f1115" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

      }

// бэктест 5 лет (за флагом backtest_public): модель и факт живого журнала не смешиваются
function btCard() {

  (DATA.equity_epoch || []).forEach((p, i, arr) => {
    const k = (p.t || "").slice(0, 7);
    if (!k || k <= lastModel) return;
    const r = p.r - (i ? arr[i - 1].r : 0);
    const f = F[k] || (F[k] = {n: 0, w: 0, r: 0});
    f.n++; f.w += r > 0 ? 1 : 0; f.r += r;
  });
  const nowKey = new Date().toISOString().slice(0, 7);
  const years = [...new Set([...Object.keys(M), ...Object.keys(F)].map(k => k.slice(0, 4)))].sort();
  const vals = Object.values(M).map(v => v.r);
  const vmax = Math.max(1, ...vals.map(Math.abs), ...Object.values(F).map(v => Math.abs(v.r)));
  const cell = (r, fact, partial) => {
    const a = Math.min(1, Math.abs(r) / vmax) * 0.55 + 0.12;
    const bg = r >= 0 ? `rgba(31,158,110,${a})` : `rgba(246,70,93,${a})`;
    const ttl = `${fmtR(r)}${fact ? " · факт (живой журнал)" : " · модель"}${partial ? " · месяц не закончен" : ""}`;
    return `<div class="c${fact ? " f" : ""}${partial ? " p" : ""}" style="background:${bg}" data-tt="${ttl}">${r > 0 ? "+" : ""}${Math.round(r)}</div>`;
  };
  let g = `<div class="h"></div>${MN.map(m => `<div class="h">${m}</div>`).join("")}<div class="h">год</div>`;
  for (const y of years) {
    let tot = 0;
    g += `<div class="y">${y.slice(2)}</div>`;
    for (let m = 1; m <= 12; m++) {
      const k = `${y}-${String(m).padStart(2, "0")}`;
      if (M[k]) { tot += M[k].r; g += cell(M[k].r, false, false); }
      else if (F[k]) { tot += F[k].r; g += cell(F[k].r, true, k === nowKey); }
      else g += `<div class="c e">·</div>`;
    }
    g += `<div class="t ${cls(tot)}">${fmtR(tot, 0)}</div>`;
  }
  const fk = Object.keys(F).sort();
  const fSum = fk.reduce((a, k) => a + F[k].r, 0), fPos = fk.filter(k => F[k].r > 0).length;
  const pos = vals.filter(v => v > 0).length, n = vals.length;
  const sorted = [...vals].sort((a, b) => a - b);
  let run = 0, worstRun = 0;
  for (const k of Object.keys(M).sort()) { run = M[k].r <= 0 ? run + 1 : 0; worstRun = Math.max(worstRun, run); }
  const T = BT.totals || {}, w = BT.max_dd_window;
  const f = s => s ? s.slice(8, 10) + "." + s.slice(5, 7) + "." + s.slice(0, 4) : "?";
  return `<section><div class="card-h"><h3>Бэктест 5 лет</h3><span class="aside">модель, не живой журнал</span></div>
    <div class="bt-wrap"><div class="bt">${g}</div></div>
    <div class="bt-legend"><span><i class="lg"></i>модель (до ${lastModel})</span><span><i class="lg f"></i>факт (живой журнал, до комиссий)</span><span><i class="lg p"></i>текущий месяц</span></div>
    ${fk.length ? `<div class="mystat" style="margin-top:10px">факт с ${fk[0]}: <b>${fk.length}</b> мес. · <b class="${cls(fSum)}">${fmtR(fSum)}</b> · плюсовых <b>${fPos}/${fk.length}</b> — по живому журналу</div>` : ""}
    <div class="bt-stats"><span>плюсовых месяцев <b>${pos}/${n}</b> (${Math.round(pos / n * 100)}%)</span>
      <span>медиана <b>${fmtR(sorted[Math.floor(n / 2)])}</b></span><span>худший <b class="dn">${fmtR(sorted[0])}</b></span>
      <span>убыточных подряд <b>≤${worstRun}</b></span><span>сделок <b>${T.trades || "—"}</b></span>
      <span>на сделку <b>${T.expectancy_r != null ? fmtR(T.expectancy_r, 2) : "—"}</b></span>
      <span>просадка <b class="dn">${MINUS}${T.max_dd_r != null ? T.max_dd_r.toFixed(0) : "—"}R</b>${w ? ` <span class="mut">(${f(w.peak)} → ${f(w.trough)}, ${w.days} дн.)</span>` : ""}</span></div>

}

function dayBarsSVG(days) {

  const iMax = vals.indexOf(Math.max(...vals)), iMin = vals.indexOf(Math.min(...vals));

    const v = d.pnl_usd, x = P.l + (i + .5) * slot - bw / 2, y0 = Y(0), pos = v >= 0;
    const hgt = Math.max(Math.abs(y0 - Y(v)), 2), top = pos ? y0 - hgt : y0, r = Math.min(4, hgt / 2, bw / 2);
    const path = pos ? `M${x} ${y0}V${top + r}Q${x} ${top} ${x + r} ${top}H${x + bw - r}Q${x + bw} ${top} ${x + bw} ${top + r}V${y0}Z`
      : `M${x} ${y0}V${y0 + hgt - r}Q${x} ${y0 + hgt} ${x + r} ${y0 + hgt}H${x + bw - r}Q${x + bw} ${y0 + hgt} ${x + bw} ${y0 + hgt - r}V${y0}Z`;
    g += `<rect x="${x - 4}" y="${P.t - 6}" width="${bw + 8}" height="${H - P.t - P.b + 12}" fill="transparent" data-tt="${ddmm(d.day)} · ${fmtUsd(v, true)} · ${d.wins}✓ ${d.losses}✕"/>
      <path d="${path}" fill="${pos ? "#1f9e6e" : "#f6465d"}" pointer-events="none"/>`;

function calcState() {
  if (!CALC) {
    const d = ME && ME.depo;

const fmtQty = q => q >= 1000 ? Math.round(q).toLocaleString("en-US") : q >= 100 ? q.toFixed(0)

function sizing(o) {

  const lev = notional / c.usd;
  return `<div class="sz">объём <b>${fmtQty(qty)}</b> · номинал <b>$${Math.round(notional).toLocaleString("en-US")}</b> · плечо <b class="${lev > 20 ? "warnx" : ""}">×${lev.toFixed(1)}</b> · риск <b>$${riskUsd.toFixed(riskUsd >= 100 ? 0 : 2)}</b>${lev > 20 ? ' <span class="warnx">— выше ×20, уменьши риск</span>' : ""}</div>`;

function revenueSVG(daily, cur) {
  const days = 90, now = Date.now(), pts = [];
  const map = new Map(daily.filter(x => x.cur === cur).map(x => [x.d, x.s]));
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now - i * 864e5).toISOString().slice(0, 10);
    pts.push([d, map.get(d) || 0]);
  }
  const W = svgW(), H = 180, P = {l: 4, r: 4, t: 18, b: 22};
  const vmax = Math.max(1, ...pts.map(p => p[1])), bw = (W - P.l - P.r) / days;
  let g = `<line x1="${P.l}" x2="${W - P.r}" y1="${H - P.b}" y2="${H - P.b}" stroke="rgba(255,255,255,.12)"/>`;
  pts.forEach(([d, v], i) => {
    if (!v) return;
    const h = Math.max(2, v / vmax * (H - P.t - P.b));
    g += `<rect x="${P.l + i * bw + .5}" y="${H - P.b - h}" width="${Math.max(1.5, bw - 2)}" height="${h}" rx="1.5" fill="#f7a600" data-tt="${d.slice(8, 10)}.${d.slice(5, 7)} · ${v} ${cur === "XTR" ? "⭐" : esc(cur)}"/>`;
  });
  g += `<text x="${P.l}" y="${H - 4}" font-size="10" font-family="Inter,sans-serif" fill="#6c7480">${pts[0][0].slice(5)}</text>
        <text x="${W - P.r}" y="${H - 4}" text-anchor="end" font-size="10" font-family="Inter,sans-serif" fill="#6c7480">сегодня</text>
        <text x="${W - P.r}" y="11" text-anchor="end" font-size="10" font-family="Inter,sans-serif" fill="#6c7480">макс/день ${vmax}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

// --- монеты: формат цены ---
function fmtPx(p) {
  if (p >= 1000) return p.toLocaleString("en-US", {maximumFractionDigits: 0});
  if (p >= 100) return p.toFixed(2);
  if (p >= 1) return p.toFixed(3);
  return p.toFixed(p >= 0.01 ? 5 : 7).replace(/0+$/, "").replace(/\.$/, "");
}

// --- «сделка на графике»: свечи + уровни + метки входа/выхода ---
function pxPrec(p) { return p >= 1000 ? 1 : p >= 100 ? 2 : p >= 1 ? 3 : p >= 0.01 ? 5 : 7; }

function renderTradeChart(d) {
  let res;
  if (d.open) {
    const last = d.candles.length ? d.candles[d.candles.length - 1][4] : null;
    const risk = Math.abs(d.entry - d.stop);
    if (d.in_pos && last && risk) {
      const ur = (d.side === "LONG" ? last - d.entry : d.entry - last) / risk;
      res = `<b class="res ${cls(ur)}">${fmtR(ur, 2)} <span class="mut" style="font-size:11px">сейчас</span></b>`;
    } else res = `<b class="res mut">ждёт входа</b>`;
  } else res = `<b class="res ${cls(d.result_r)}">${fmtR(d.result_r)}</b>`;
  $("#chartHead").innerHTML = `${ava(d.symbol, d.side)}
     <div><div style="font:650 15px/1.2 var(--font)">${esc(d.symbol)} <span class="tf">${esc(d.tf_signal)}</span></div>
     <div class="mut" style="font:500 11.5px/1.2 var(--font);margin-top:3px">${d.side === "LONG" ? "лонг" : "шорт"} · #${d.id}${d.tf !== d.tf_signal ? " · свечи " + esc(d.tf) : ""}${d.open ? " · открыта" : ""}</div></div>
     ${res}`;
  const el = $("#chartBody");
  el.innerHTML = "";
  if (CHART) { try { CHART.remove(); } catch (_) {} }
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: {background: {type: "solid", color: "transparent"}, textColor: "#6c7480", fontSize: 10.5,
             fontFamily: "Inter, -apple-system, system-ui, sans-serif", attributionLogo: false},
    grid: {vertLines: {color: "rgba(255,255,255,.03)"}, horzLines: {color: "rgba(255,255,255,.045)"}},
    timeScale: {timeVisible: true, secondsVisible: false, borderVisible: false},
    rightPriceScale: {borderVisible: false},
    crosshair: {mode: 0, vertLine: {labelBackgroundColor: "#262b32"}, horzLine: {labelBackgroundColor: "#262b32"}},
    localization: {locale: "ru-RU"},
  });
  CHART = chart;
  const prec = pxPrec(d.entry);
  const sr = chart.addCandlestickSeries({
    upColor: "#1f9e6e", downColor: "#f6465d", borderVisible: false,
    wickUpColor: "#1f9e6e", wickDownColor: "#f6465d",
    priceFormat: {type: "price", precision: prec, minMove: Math.pow(10, -prec)},
  });
  sr.setData(d.candles.map(c => ({time: c[0], open: c[1], high: c[2], low: c[3], close: c[4]})));
  const line = (px, color, title, style) => px && sr.createPriceLine(
    {price: px, color, lineWidth: 1, lineStyle: style == null ? 2 : style, title});
  line(d.entry, "#f7a600", "вход");
  line(d.stop, "#f6465d", "стоп");
  (d.tps || []).forEach((tp, i) => line(tp, "#1f9e6e", "цель" + (d.tps.length > 1 ? i + 1 : "")));
  if (d.exit_price) line(d.exit_price, "#a3abb6", "выход", 0);
  const ts = iso => iso ? Math.floor(new Date(iso).getTime() / 1000) : null;
  const snap = t => {                                     // к ближайшей свече слева
    let best = d.candles.length ? d.candles[0][0] : t;
    for (const c of d.candles) { if (c[0] <= t) best = c[0]; else break; }
    return best;
  };
  const mk = [], tF = ts(d.filled_at), tC = ts(d.closed_at);
  if (tF) mk.push({time: snap(tF), position: d.side === "LONG" ? "belowBar" : "aboveBar",
                   color: "#f7a600", shape: d.side === "LONG" ? "arrowUp" : "arrowDown", text: "вход"});
  if (tC && !d.open) mk.push({time: snap(tC), position: d.side === "LONG" ? "aboveBar" : "belowBar",
                   color: d.result_r >= 0 ? "#1f9e6e" : "#f6465d",
                   shape: d.side === "LONG" ? "arrowDown" : "arrowUp", text: fmtR(d.result_r)});
  sr.setMarkers(mk);
  chart.timeScale().fitContent();
}

    if (isFinite(v) && v > 0) {
      if (id === "calcUsd") { c.usd = v; store.set("calc.usd", v); } else { c.risk = Math.min(v, 10); store.set("calc.risk", c.risk); }
      clearTimeout(inputT); inputT = setTimeout(() => render(true), 250);
    }
  }
});
document.addEventListener("change", e => {
  const el = e.target.closest("select[data-pref]");
  if (!el || !(ME && ME.notify)) return;
  const qs = ($('select[data-pref="quiet_start"]') || {}).value, qe = ($('select[data-pref="quiet_end"]') || {}).value;
  if ((qs === "") !== (qe === "")) return;              // ждём вторую границу
  prefsPost(qs === "" ? {quiet_start: null, quiet_end: null} : {quiet_start: +qs, quiet_end: +qe},
            qs === "" ? "Тихие часы выключены" : `Тихие часы ${qs}:00–${qe}:00 UTC`);
});
function prefsPost(body, okMsg) {
  fetch("api/prefs", {method: "POST", headers: authHdr(), body: JSON.stringify(body)})
    .then(r => r.json().catch(() => null).then(d => [r.ok, d]))
    .then(([ok, d]) => {
      if (ok && d && d.ok) { ME.depo = d.depo; ME.notify = d.notify; toast(okMsg); hap("ok"); if ("depo_usd" in body) { ACC_EDIT = null; if (CAN_ACC) accLoad(); } }
      else { toast((d && d.err) || "Не сохранилось — переоткрой дашборд"); hap("err"); }
      render(true);
    }).catch(() => toast("Сеть недоступна"));
}
// подсказки [data-tt] (календарь, столбики, выручка): наведение мышью и тап пальцем
function ttShow(ev) {
  const c = ev.target.closest && ev.target.closest("[data-tt]"), tip = $("#tip");
  if (!c) { tip.style.opacity = "0"; return; }
  tip.textContent = c.dataset.tt;
  tip.style.left = Math.max(8, Math.min(ev.clientX - 40, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = (ev.clientY - 44) + "px"; tip.style.opacity = "1";
}
document.addEventListener("pointermove", e => { if (e.target.closest && e.target.closest("[data-tt]")) ttShow(e); else if (e.pointerType === "mouse") $("#tip").style.opacity = "0"; });
document.addEventListener("pointerdown", ttShow);
// числа/выбор/URL в настройках — сохранение на change
document.addEventListener("change", e => {
  const el = e.target.closest("[data-set]");
  if (!el || !(ME && ME.admin) || el.classList.contains("tgl")) return;
  const t = el.dataset.t;
  let v = el.value;
  if (t === "int" || t === "float") {
    v = Number(String(v).trim().replace(",", "."));   // «0,5» с русской клавиатуры
    if (!isFinite(v)) { toast("Не число"); render(true); return; }
    if (t === "int") v = Math.trunc(v);
  }
  admSet(el.dataset.set, v);
});
</script>
